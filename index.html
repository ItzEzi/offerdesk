function shardOf(id,n){if(n<2)return 0;let h=0;const s=String(id);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%n}
const COLS={
  deals:{n:8,key:'deals',get:()=>state.deals,set:m=>{state.deals=m}},
  practice:{n:1,key:'practice',get:()=>state.practice,set:m=>{state.practice=m}},
  campaigns:{n:1,key:'campaigns',get:()=>state.campaigns,set:m=>{state.campaigns=m}},
  spend:{n:1,key:'spend',get:()=>state.spend,set:m=>{state.spend=m}},
  emails:{n:4,key:'mail',get:()=>state.mail.emails,set:m=>{state.mail.emails=m}},
  texts:{n:1,key:'mail',get:()=>Object.fromEntries((state.mail.texts||[]).filter(t=>t&&t.sid).map(t=>[t.sid,t])),set:m=>{state.mail.texts=Object.values(m).sort((a,b)=>String(a.at).localeCompare(String(b.at)))}}
};
const WHOLES={
  settings:{key:'settings',get:()=>state.settings,set:v=>{state.settings=deepMerge(DEFAULTS,v||{})}},
  conn:{key:'conn',get:()=>state.conn,set:v=>{const L=state.conn||{};const n=v&&typeof v==='object'?Object.assign({},v):{};n.accounts=Object.assign({},L.accounts||{},n.accounts||{});state.conn=n}},  /* keep inboxes this device knows that the cloud copy doesn't */
  research:{key:'research',get:()=>state.research||{},set:v=>{state.research=v&&typeof v==='object'?v:{}}},
  /* keys and Gmail links: a blank in the cloud copy never wipes a key or inbox this device has (that used to log devices out);
     only an inbox removed on purpose (goneAccts) is removed everywhere */
  secrets:{key:'secrets',get:()=>{const s=secrets();return {apiKey:s.apiKey||'',model:s.model||'',elevenKey:s.elevenKey||'',accounts:acctList(),goneAccts:goneMap(s.goneAccts)}},
    set:v=>{v=v||{};const s=secrets();for(const k of ['apiKey','model','elevenKey'])if(v[k])s[k]=v[k];
      const gone=goneMap(s.goneAccts);for(const [id,t] of Object.entries(goneMap(v.goneAccts)))if(!(gone[id]>=t))gone[id]=t;const local=acctList();
      const acc=(Array.isArray(v.accounts)?v.accounts:[]).filter(a=>a&&a.id).map(a=>Object.assign({},a));
      for(const a of acc){const l=local.find(x=>x.id===a.id);if(!a.url&&l&&l.url)a.url=l.url}
      const mine=local.find(a=>a.id===cm().acct);if(mine&&!acc.some(a=>a.id===mine.id))acc.unshift(Object.assign({},mine));
      for(const a of local)if(!acc.some(x=>x.id===a.id))acc.push(Object.assign({},a));
      s.accounts=acc.filter(a=>!(gone[a.id]>(a.at||0)));for(const a of s.accounts)if(gone[a.id]!=null)delete gone[a.id];s.goneAccts=gone;delete s.bridgeUrl;lsSet(SECRET_KEY,JSON.stringify(s))}}
};
const range=(p,n)=>Array.from({length:n},(_,i)=>p+i);
const PARTS=[...range('deals',8),'practice','campaigns','spend',...range('emails',4),'texts','settings','conn','research','secrets','mailmeta','activity'];
const KEY_PARTS={deals:range('deals',8),practice:['practice'],campaigns:['campaigns'],spend:['spend'],mail:[...range('emails',4),'texts','mailmeta'],activity:['activity'],settings:['settings'],conn:['conn'],research:['research'],secrets:['secrets']};
const partOf=(c,id)=>COLS[c].n>1?c+shardOf(id,COLS[c].n):c;
function parsePart(P){const m=String(P).match(/^([a-z]+)(\d*)$/);return {c:m[1],i:m[2]===''?0:+m[2]}}
function keyOfPart(P){const {c}=parsePart(P);return COLS[c]?COLS[c].key:WHOLES[c]?WHOLES[c].key:c==='mailmeta'?'mail':c}
const mailMeta=()=>({lastSync:state.mail.lastSync||null,lastSms:state.mail.lastSms||''});
const actIds=()=>(state.activity||[]).map(a=>a.id).join(',');

/* sync bookkeeping, kept per device */
const SYNC_KEY='od.sync';let CM=null;
function cm(){if(!CM){let o=null;try{o=JSON.parse(lsGet(SYNC_KEY)||'null')}catch(e){}CM=Object.assign({on:false,acct:null,base:false,joined:false,revs:{},s:{},h:{},tomb:{},dirty:{},up:{},last:null,err:'',lease:null,folderUrl:'',email:''},o||{})}return CM}
let cmT;function saveCM(){clearTimeout(cmT);cmT=setTimeout(()=>lsSet(SYNC_KEY,JSON.stringify(CM)),400)}
function saveCMNow(){clearTimeout(cmT);if(CM)lsSet(SYNC_KEY,JSON.stringify(CM))}
function cloudOn(){const m=cm();return !!(m.on&&m.acct&&acctList().some(a=>a.id===m.acct&&a.url))}
const cloudInfo=()=>acctInfo(cm().acct)||{};

/* change tracking: called after every local save */
function detectCol(c,now){
  const items=COLS[c].get()||{};const seen=new Set();
  for(const id of Object.keys(items)){const k=c+'/'+id;seen.add(k);const h=hashOf(items[id]);if(CM.h[k]!==h){CM.h[k]=h;CM.s[k]=now;delete CM.tomb[k];CM.dirty[partOf(c,id)]=1}}
  const pre=c+'/';for(const k of Object.keys(CM.h)){if(k.startsWith(pre)&&!seen.has(k)){const id=k.slice(pre.length);delete CM.h[k];delete CM.s[k];CM.tomb[k]=now;CM.dirty[partOf(c,id)]=1}}
}
function detectWhole(w,now){const h=hashOf(WHOLES[w].get());if(CM.h[w]!==h){CM.h[w]=h;CM.s[w]=now;CM.dirty[w]=1}}
function detectFlag(P,val){const h=hashOf(val);if(CM.h[P]!==h){CM.h[P]=h;CM.dirty[P]=1}}
function cloudTrack(key){
  if(!cloudOn()||!cm().base)return;const now=Date.now();
  if(key==='deals'||key==='practice'||key==='campaigns'||key==='spend')detectCol(key,now);
  else if(key==='mail'){detectCol('emails',now);detectCol('texts',now);detectFlag('mailmeta',mailMeta())}
  else if(key==='activity')detectFlag('activity',actIds());
  else if(WHOLES[key])detectWhole(key,now);
  saveCM();if(Object.keys(CM.dirty).length)schedulePush();
}
/* starting point: what's here now counts as "old" (time 0), so the cloud wins any tie */
function cloudBaseline(){
  const m=cm();m.h={};m.s={};m.tomb={};m.dirty={};m.revs={};m.up={};m.joined=false;m.err='';
  for(const c of Object.keys(COLS)){const items=COLS[c].get()||{};for(const id of Object.keys(items))m.h[c+'/'+id]=hashOf(items[id])}
  for(const w of Object.keys(WHOLES))m.h[w]=hashOf(WHOLES[w].get());
  m.h.mailmeta=hashOf(mailMeta());m.h.activity=hashOf(actIds());
  for(const P of PARTS)m.dirty[P]=1;m.base=true;saveCMNow();
}
function pruneTombs(){const cut=Date.now()-60*DAY;for(const [k,t] of Object.entries(CM.tomb))if(t<cut)delete CM.tomb[k]}

/* what this device would save for one part */
function localDoc(P){
  const {c,i}=parsePart(P);
  if(COLS[c]){const C=COLS[c];const all=C.get()||{};const items={},tomb={};const pre=c+'/';
    for(const id of Object.keys(all))if(shardOf(id,C.n)===i)items[id]={t:CM.s[pre+id]||0,v:all[id]};
    for(const [k,t] of Object.entries(CM.tomb))if(k.startsWith(pre)){const id=k.slice(pre.length);if(shardOf(id,C.n)===i)tomb[id]=t}
    return {items,tomb}}
  if(WHOLES[c])return {t:CM.s[c]||0,v:WHOLES[c].get()};
  if(c==='mailmeta')return mailMeta();
  if(c==='activity')return {items:state.activity||[]};
  return null;
}
/* merge one part from the cloud into this device; says whether this device changed and whether the cloud needs our copy */
function mergeApply(P,R,dropEx){
  const {c,i}=parsePart(P);
  if(COLS[c]){
    const C=COLS[c];R=R||{};const RI=R.items||{},RT=R.tomb||{};const live=C.get()||{};const pre=c+'/';let changed=false,push=false;
    const ids=new Set(Object.keys(RI).concat(Object.keys(RT)));
    for(const id of Object.keys(live))if(shardOf(id,C.n)===i)ids.add(id);
    for(const k of Object.keys(CM.tomb))if(k.startsWith(pre)){const id=k.slice(pre.length);if(shardOf(id,C.n)===i)ids.add(id)}
    for(const id of ids){
      const k=pre+id,li=live[id],ri=RI[id],has=li!==undefined;const lt=has?(CM.s[k]||0):-1;const lTomb=CM.tomb[k],rTomb=RT[id];
      if(dropEx&&c==='deals'&&has&&li&&li.example&&!ri){delete live[id];delete CM.h[k];delete CM.s[k];changed=true;continue}
      const tomb=Math.max(lTomb==null?-1:lTomb,rTomb==null?-1:rTomb);
      let useR=false,best=-1;
      if(has&&ri){useR=!(lt>ri.t);best=useR?ri.t:lt}else if(ri){useR=true;best=ri.t}else if(has)best=lt;
      if(best>=0&&best>tomb){
        if(useR){if(!has||hashOf(ri.v)!==CM.h[k]){live[id]=ri.v;changed=true}CM.h[k]=hashOf(live[id]);CM.s[k]=ri.t;delete CM.tomb[k]}
        else if(!ri||ri.t<lt)push=true;
      }else if(tomb>=0){
        if(has){delete live[id];changed=true}
        delete CM.h[k];delete CM.s[k];CM.tomb[k]=tomb;
        if(ri||rTomb==null||rTomb<tomb)push=true;
      }
    }
    if(changed)C.set(live);
    return {changed,push};
  }
  if(WHOLES[c]){
    const W=WHOLES[c];const lt=CM.s[c]||0;
    if(!R||typeof R!=='object'||R.t==null)return {changed:false,push:true};
    if(lt>R.t)return {changed:false,push:true};
    let changed=false;if(hashOf(R.v)!==CM.h[c]){W.set(R.v);changed=true}
    CM.h[c]=hashOf(W.get());CM.s[c]=R.t;
    if((c==='secrets'||c==='conn')&&CM.h[c]!==hashOf(R.v)){CM.s[c]=Date.now();return {changed,push:true}}  /* we kept something the cloud copy was missing: send it back */
    return {changed,push:false};
  }
  if(c==='mailmeta'){
    R=R||{};const L=mailMeta();const mx=(a,b)=>String(a||'')>String(b||'')?a:b;
    const M={lastSync:mx(L.lastSync,R.lastSync)||null,lastSms:mx(L.lastSms,R.lastSms)||''};
    const changed=M.lastSync!==L.lastSync||M.lastSms!==L.lastSms;if(changed){state.mail.lastSync=M.lastSync;state.mail.lastSms=M.lastSms}
    CM.h.mailmeta=hashOf(M);return {changed,push:M.lastSync!==(R.lastSync||null)||M.lastSms!==(R.lastSms||'')};
  }
  if(c==='activity'){
    const L=state.activity||[];const RA=(R&&Array.isArray(R.items))?R.items:[];const lids=new Set(L.map(a=>a.id)),rids=new Set(RA.map(a=>a&&a.id));
    const merged=L.concat(RA.filter(a=>a&&a.id&&!lids.has(a.id))).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,300);
    const changed=merged.some(a=>!lids.has(a.id));if(changed)state.activity=merged;
    CM.h.activity=hashOf(actIds());return {changed,push:merged.some(a=>!rids.has(a.id))};
  }
  return {changed:false,push:false};
}

/* one sync: ask which parts changed in the cloud, merge them, save ours */
const CS={p:null,again:false,timer:null};
function schedulePush(ms){clearTimeout(CS.timer);CS.timer=setTimeout(()=>{if(CS.p){CS.again=true;return}cloudSync()},ms||2500)}
function cloudSync(manual){
  if(!cloudOn())return Promise.resolve(false);
  if(CS.p){CS.again=true;return CS.p}
  CS.p=runCloudSync(manual).finally(()=>{CS.p=null;if(CS.again){CS.again=false;schedulePush(1200)}});
  return CS.p;
}
async function runCloudSync(manual){
  state.cloudSyncing=true;cloudBits();const changed=new Set();let ok=false;const errBefore=CM.err;
  try{
    for(let round=0;round<4;round++){flushAll();if(!(await cloudRound(changed)))break}
    CM.joined=true;CM.last=nowISO();CM.err='';ok=true;
  }catch(e){CM.err=bridgeErr(e);if(manual)toast('Cloud save: '+CM.err,5200)}
  finally{
    state.cloudSyncing=false;saveCMNow();
    if(changed.size&&state.view==='deal'&&state.dealId&&!state.deals[state.dealId])go('listings');
    if(changed.size||manual||CM.err!==errBefore)render();else cloudBits();
  }
  if(ok)photoSync();
  return ok;
}
async function cloudRound(changed){
  pruneTombs();
  const meta=await bridge('cloud_meta',{},CM.acct);
  CM.lease=meta.lease||null;if(meta.folderUrl)CM.folderUrl=meta.folderUrl;if(meta.email)CM.email=meta.email;
  const rr=meta.revs||{};
  const pull=PARTS.filter(P=>(rr[P]||0)!==(CM.revs[P]||0));const got={};
  for(let i=0;i<pull.length;i+=4){const r=await bridge('cloud_get',{names:pull.slice(i,i+4)},CM.acct);Object.assign(got,r.parts||{})}
  const dropEx=false&&!CM.joined&&Object.keys(got).some(P=>/^deals\d/.test(P)&&got[P]&&got[P].data&&Object.keys(got[P].data.items||{}).length);
  const toPush=[];const touched=new Set();
  for(const P of PARTS){
    const g=got[P];
    if(g){const res=mergeApply(P,g.data,dropEx);CM.revs[P]=g.rev||0;if(res.changed){changed.add(keyOfPart(P));touched.add(keyOfPart(P))}if(res.push)toPush.push(P);else delete CM.dirty[P]}
    else if(CM.dirty[P])toPush.push(P);
  }
  for(const k of touched)if(k!=='secrets')writeKey(k);
  if(!toPush.length)return false;
  let conflict=false,batch={},size=0;
  const send=async()=>{const r=await bridge('cloud_put',{parts:batch},CM.acct);for(const [P,rev] of Object.entries(r.revs||{})){CM.revs[P]=rev;delete CM.dirty[P]}if(r.conflicts&&Object.keys(r.conflicts).length)conflict=true;batch={};size=0};
  for(const P of toPush){const data=localDoc(P);const n=JSON.stringify(data).length;if(size&&size+n>2.5e6)await send();batch[P]={base:CM.revs[P]||0,data};size+=n}
  if(Object.keys(batch).length)await send();
  saveCMNow();return conflict;
}

/* photos: saved as images in the Drive folder's "photos" subfolder */
const PS={busy:false,miss:{}};
function blobB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
async function photoSync(){
  if(!cloudOn()||!IDB.db||PS.busy)return;PS.busy=true;let got=0;
  try{
    const ref=new Map();for(const d of Object.values(state.deals))for(const id of d.photoIds||[])ref.set(id,d.id);
    const local=new Set(await IDB.tx('photos','readonly',s=>s.getAllKeys()));CM.up=CM.up||{};
    const needUp=[...ref.keys()].some(id=>local.has(id)&&!CM.up[id]);
    const needDown=[...ref.keys()].some(id=>!local.has(id)&&!(PS.miss[id]>Date.now()-5*60e3));
    const gcDue=Date.now()-(CM.photoGc||0)>30*60e3;
    if(!needUp&&!needDown&&!gcDue)return;
    const list=(await bridge('photo_list',{},CM.acct)).photos||[];const cloud=new Set(list.map(p=>p.id));CM.up=Object.fromEntries(list.map(p=>[p.id,1]));
    for(const [id,dealId] of ref){
      if(local.has(id)&&!cloud.has(id)){const r=await IDB.get('photos',id);if(r&&r.blob){await bridge('photo_put',{id,type:r.blob.type||'image/jpeg',data:await blobB64(r.blob),meta:{dealId:r.dealId||dealId,w:r.w,h:r.h,source:r.source,at:r.at}},CM.acct);CM.up[id]=1}}
      else if(!local.has(id)){
        if(!cloud.has(id)){PS.miss[id]=Date.now();continue}
        try{const r=await bridge('photo_get',{id},CM.acct);const m=r.meta||{};await IDB.put('photos',{id,dealId:m.dealId||dealId,blob:b64ToBlob(r.data,r.type),w:m.w,h:m.h,source:m.source||'cloud',at:m.at||nowISO()});delete PS.miss[id];got++}catch(e){PS.miss[id]=Date.now()}
      }
    }
    if(gcDue){const old=list.filter(p=>!ref.has(p.id)&&Date.now()-new Date(p.at).getTime()>3600e3).map(p=>p.id);if(old.length){await bridge('photo_del',{ids:old},CM.acct);old.forEach(id=>delete CM.up[id])}CM.photoGc=Date.now()}
  }catch(e){}
  finally{PS.busy=false;saveCM();if(got&&state.view==='deal'&&state.dealId)ensurePhotoUrls(state.dealId)}
}

/* linking another device: the link carries the bridge address and secret, then the cloud fills in the rest */
const b64url=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

function cloudLinkURL(){const a=acctList().find(x=>x.id===cm().acct);if(!a)return '';return ONLINE_URL+'#link/'+b64url(JSON.stringify({u:a.url,k:bridgeKey(),a:a.id}))}

/* what Maya did with the last 30 days of wholesaler emails, so "0 new" never looks like nothing happened */
function mailStats(){

  for(const m of ms){if(m.status==='new'){st.waiting++;continue}if(m.status==='ignored'||m.status==='reply')continue;st.read++;

function mailRecap(st){st=st||mailStats();
  if(!st.read&&!st.waiting)return 'No wholesaler emails found in the last 30 days.';
  const p=[`Last 30 days: ${st.read} wholesaler email${st.read===1?'':'s'} read`];
  if(st.deals)p.push(`${st.deals} deal${st.deals===1?'':'s'} pulled out`+(st.over?` (${st.over} over ${moneyK(boxCap())}, under the “Over ${moneyK(boxCap())}” button)`:'')+(st.passed?`, ${st.passed} passed`:''));

let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;doRender()})}
function doRender(){
  const ae=document.activeElement;
  const fid=ae&&ae.id&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)?ae.id:null;
  const fval=fid?ae.value:null;let sel=null;try{if(fid&&ae.type!=='number'&&ae.type!=='range')sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  const scrolls={};document.querySelectorAll('[data-keep-scroll]').forEach(el=>{if(el.id)scrolls[el.id]=[el.scrollTop,el.scrollLeft]});
  const opens={};document.querySelectorAll('details[id]').forEach(el=>{opens[el.id]=el.open});
  const y=window.scrollY;
  $('#topbar').innerHTML=topbarHTML();
  $('#alertbar').innerHTML=alertHTML();
  $('#main').innerHTML=state.loaded?viewHTML():`<div class="wrap page"><div class="busy"><div class="spin"></div>Opening your desk…</div></div>`;
  $('#modal-root').innerHTML=modalHTML();
  try{dictDecorate()}catch(e){console.warn(e)}
  for(const [id,[t,l]] of Object.entries(scrolls)){const el=document.getElementById(id);if(el){el.scrollTop=t;el.scrollLeft=l}}
  for(const [id,o] of Object.entries(opens)){const el=document.getElementById(id);if(el)el.open=o}
  window.scrollTo(0,y);
  if(fid){const el=document.getElementById(fid);if(el){if(el.type!=='checkbox'&&el.type!=='file'&&el.value!==fval)el.value=fval;el.focus({preventScroll:true});try{if(sel&&sel[0]!=null)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  document.querySelectorAll('[data-stick]').forEach(el=>el.scrollTop=el.scrollHeight);
  if(state.view==='markets')try{drawMarketMap()}catch(e){console.warn(e)}

}

/* ================= price rail ================= */
function railHTML(d,c,mini){
  if(!c.ready)return mini?'<span class="small muted">Needs ARV</span>':`<div class="note">Add an ARV to set your ceiling.</div>`;
  const L=curList(d),our=(d.offers||[]).filter(o=>o.by==='us'),their=(d.offers||[]).filter(o=>o.by==='them');
  const vals=[c.opening,c.mao,L,...our.map(o=>o.price),...their.map(o=>o.price)].filter(v=>v!=null&&v>0);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.06||hi*.05;lo-=pad;hi+=pad;
  const X=v=>(v-lo)/(hi-lo)*100;const xs=v=>X(v).toFixed(2)+'%';
  let h=`<div class="rail ${mini?'rail-mini':''}" ${mini?'style="padding:0"':''}><div class="rail-track"><div class="rail-zone" style="left:${xs(Math.min(c.opening,c.mao))};width:${Math.abs(X(c.mao)-X(c.opening)).toFixed(2)}%"></div>`;
  if(!our.length)h+=`<i class="rail-pin open" style="left:${xs(c.opening)}" title="Opening ${money(c.opening)}"></i>`;
  our.forEach(o=>h+=`<i class="rail-pin ours" style="left:${xs(o.price)}" title="You ${money(o.price)}"></i>`);
  their.forEach(o=>h+=`<i class="rail-pin theirs" style="left:${xs(o.price)}" title="Them ${money(o.price)}"></i>`);
  if(L)h+=`<i class="rail-pin list" style="left:${xs(L)}" title="Asking ${money(L)}"></i>`;
  h+=`<i class="rail-ceil" style="left:${xs(c.mao)}" title="Ceiling ${money(c.mao)}"></i></div>`;
  if(!mini){
    const labs=[{v:c.mao,t:'Ceiling',cls:'c',pos:'top',p:0}];
    if(L)labs.push({v:L,t:'Asking',pos:'top',p:1});
    if(their.length)labs.push({v:their[their.length-1].price,t:'Them',pos:'top',p:2});
    if(our.length)labs.push({v:our[our.length-1].price,t:'You',pos:'bot',p:0});
    labs.push({v:c.opening,t:'Opening',pos:'bot',p:our.length?2:0});
    labs.push({v:c.target,t:'Target',pos:'bot',p:1});
    for(const pos of ['top','bot']){
      const kept=[];labs.filter(l=>l.pos===pos).sort((a,b)=>a.p-b.p).forEach(l=>{if(kept.every(k=>Math.abs(X(k.v)-X(l.v))>20))kept.push(l)});
      kept.forEach(l=>{const x=X(l.v);const al=x<9?' l':x>91?' rr':'';h+=`<span class="rail-lab ${pos}${al} ${l.cls||''}" style="left:${x.toFixed(2)}%">${l.t} <b>${moneyK(l.v)}</b></span>`});
    }
  }
  return h+'</div>';
}

const SPECIAL=[
  ['target','In my target markets',d=>!!dealTarget(d)],['campaign','From a campaign',d=>!!d.campaign],
  ['reply','Reply waiting',d=>replyWaiting(d)],['draft','Draft ready',d=>draftOpen(d)],['star','Starred',d=>!!d.starred],
  ['drop','Price dropped',d=>priceDropped(d)],['stale','Stale (2× ZIP avg days)',d=>{const x=dom(d);return x!=null&&x>=Math.max(60,2*(zipDom(d)||45))}],
  ['flip','Works as flip',(d,c)=>c.ready&&curList(d)!=null&&curList(d)<=c.maoFlip],['ws','Works as wholesale',(d,c)=>c.ready&&curList(d)!=null&&curList(d)<=c.maoWs],
  ['half','Ask under 50% of ARV',(d,c)=>c.ready&&curList(d)!=null&&curList(d)<c.A*.5],['one','1% rule',d=>{const r=d.rent||d.rentEst;return r&&curList(d)&&r>=.01*(curList(d)+(d.rehab||0))}],
  ['photos','Has photos',d=>photoCount(d)>0],['noarv','Missing ARV',d=>!d.arv],['s80','Deal score 80+',d=>{const S=dealScore(d);return !!S&&S.score>=80}],['reject','Market rejection',d=>{const m=marketSignal(d);return !!m&&m.level==='rejection'}],['over','Emailed deals over your buy box',d=>overBox(d)]];
function listFilter(){
  const f=state.lf;const q=f.q.trim().toLowerCase();
  return Object.values(state.deals).filter(d=>{
    if(q&&!([d.address,d.city,d.state,d.zip,d.agent&&d.agent.name,d.wholesalerName].join(' ').toLowerCase().includes(q)))return false;
    if(f.source!=='all'&&(f.source==='wholesaler')!==(d.source==='wholesaler'))return false;
    if(f.stage!=='all'&&(d.stage||'new')!==f.stage)return false;
    if(f.status!=='all'&&offerStatus(d)[0]!==f.status)return false;
    if(f.sentiment!=='all'&&(d.sentiment||'none')!==f.sentiment)return false;
    if(f.type!=='all'&&(d.propertyType||'single_family')!==f.type)return false;
    if(f.beds!=='any'&&!((d.beds||0)>=+f.beds))return false;
    if(f.state!=='all'&&(d.state||'')!==f.state)return false;
    if(f.autopilot!=='all'&&(!!d.autopilot)!==(f.autopilot==='on'))return false;
    if(f.price!=='any'){const L=curList(d)||0;const [a,b]=f.price.split('-').map(Number);if(L<a||(b&&L>=b))return false}
    if(f.special!=='over'&&overBox(d))return false;
    if(checking(d))return false;
    if(f.special!=='all'){const s=SPECIAL.find(x=>x[0]===f.special);if(s&&!s[2](d,calc(d)))return false}
    return true;

  return Object.values(state.deals).filter(d=>d.source==='wholesaler').filter(d=>{
    if(!L.showPassed&&d.stage==='dead')return false;
    if(!L.showOver&&overBox(d))return false;
    if(checking(d))return false;
    if(q&&!([d.address,d.city,d.zip,d.wholesalerName].join(' ').toLowerCase().includes(q)))return false;
    if(L.fav&&!d.favorite)return false;

function timelineCard(d,c){

  (d.priceHistory||[]).forEach((p,i)=>ev.push({lane:0,x:day(p.date),label:(i?'':'Listed ')+moneyK(p.price),kind:'price'}));
  (d.thread||[]).forEach(t=>{if(t.dir!=='note')ev.push({lane:t.dir==='out'?1:2,x:day(t.at),label:t.price?moneyK(t.price):t.channel,kind:t.dir})});
  const todayX=day(nowISO());const maxX=Math.max(todayX,zipDom(d)||0,...ev.map(e=>e.x))+4;
  const W=700,H=176,l=58,r=16,X=v=>l+v/maxX*(W-l-r);const ys=[40,86,130];const step=maxX>180?30:maxX>90?14:maxX>40?7:5;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Deal timeline in days on market">`;
  ['Price','You','Them'].forEach((nm,i)=>svg+=`<line class="lane" x1="${l}" x2="${W-r}" y1="${ys[i]}" y2="${ys[i]}"/><text x="4" y="${ys[i]+4}">${nm}</text>`);
  for(let v=0;v<=maxX;v+=step)svg+=`<text x="${X(v)}" y="${H-6}" text-anchor="middle">${Math.round(v)}d</text>`;
  if(zipDom(d))svg+=`<line x1="${X(zipDom(d))}" x2="${X(zipDom(d))}" y1="18" y2="${H-22}" stroke="var(--s-amber)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${X(zipDom(d))+4}" y="13" style="fill:var(--t-amber)">ZIP avg ${zipDom(d)}d</text>`;
  svg+=`<line x1="${X(todayX)}" x2="${X(todayX)}" y1="18" y2="${H-22}" stroke="var(--ink)" stroke-width="1"/><text x="${X(todayX)-4}" y="13" text-anchor="end">Today · ${Math.round(todayX)}d</text>`;
  ev.forEach(e=>{const x=X(e.x),y=ys[e.lane];
    if(e.kind==='price')svg+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="var(--s-green)"/>`;
    else if(e.kind==='out')svg+=`<circle cx="${x}" cy="${y}" r="6" fill="var(--s-blue)"/>`;

  return `<section class="card tl" id="timeline"><div class="card-head"><span class="ci slate">${ico('clock')}</span><div><h2>Deal timeline</h2><p>Offers, replies and price changes in days on market</p></div><div class="ch-r"><button class="btn sm" data-act="price-drop">Log a price change</button></div></div><div class="tbl-wrap" style="border:0">${svg}</div>
  ${crossed?`<div class="note amber">Past the ZIP average by ${Math.round(todayX-zipDom(d))} days. Sellers often get flexible here; a good moment to follow up.</div>`:''}
  ${!zipDom(d)?'<p class="small muted">Add the ZIP’s average days on market in Details (or it fills in from Redfin market data) to see when this seller crosses it.</p>':''}</section>`;
}

/* ================= photos: carousel on the deal page + full-screen viewer with zoom and Maya's marks =================
   The viewer lives outside the app's render, so zoom and pan stay put while OfferDesk refreshes in the background. */
const PIDX={};
function dealPhotos(d){return [...(d.photoIds||[]).map(id=>({id,src:photoObjURL[id]})).filter(x=>x.src),...(d.photoUrls||[]).map(u=>({id:'url:'+u,src:u}))]}
/* Maya's marks for one photo (from the Opus inspection), by photo id */
function photoMarks(d,id){
  const a=d.analysis;if(!a||!Array.isArray(a.photoLog))return [];
  const refs=a.photoRefs||[...(d.photoIds||[]),...(d.photoUrls||[]).map(u=>'url:'+u)];
  const k=refs.indexOf(id);if(k<0)return [];const p=a.photoLog.find(x=>(x.photo||0)===k+1);
  return (p&&Array.isArray(p.marks)?p.marks:[]).map(m=>({label:String(m.label||'').slice(0,40),x:+m.x,y:+m.y,w:+m.w,h:+m.h})).filter(m=>m.label&&[m.x,m.y,m.w,m.h].every(v=>isFinite(v))&&m.w>0&&m.h>0).slice(0,8)
    .map(m=>({label:m.label,x:Math.max(0,Math.min(1,m.x)),y:Math.max(0,Math.min(1,m.y)),w:Math.min(1,m.w),h:Math.min(1,m.h)}));
}
function heroPhotoHTML(d){
  const ph=dealPhotos(d);if(!ph.length)return '';const n=ph.length;const i=Math.min(PIDX[d.id]||0,n-1);const mk=photoMarks(d,ph[i].id).length;
  return `<div class="hero-wrap"><button class="hero-btn" data-act="ph-open" data-i="${i}" aria-label="Open photo ${i+1} of ${n} full screen"><img class="hero-photo" src="${esc(ph[i].src)}" alt="Photo ${i+1} of ${n}, ${esc(streetOf(d.address))}"></button>
    ${n>1?`<button class="hero-nav prev" data-act="ph-step" data-v="-1" aria-label="Previous photo">${ico('back')}</button><button class="hero-nav next" data-act="ph-step" data-v="1" aria-label="Next photo">${ico('back')}</button>`:''}
    <span class="hero-count">${i+1} / ${n}${mk?` · ${mk} issue${mk>1?'s':''} marked`:''}</span><button class="hero-full" data-act="ph-open" data-i="${i}">${ico('expand')}Full screen</button></div>
    ${n>1?`<div class="hero-strip">${ph.map((p,k)=>`<button class="hs${k===i?' on':''}" data-act="ph-go" data-i="${k}" aria-label="Photo ${k+1}"${k===i?' aria-current="true"':''}><img src="${esc(p.src)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}`;
}
const PV={el:null,list:[],i:0,s:1,x:0,y:0,ptrs:new Map(),pinch:null,drag:null,marks:true,deal:null};
function openViewer(dealId,i){
  const d=state.deals[dealId];if(!d)return;const ph=dealPhotos(d);if(!ph.length)return;closeViewer();
  Object.assign(PV,{list:ph,i:Math.max(0,Math.min(+i||0,ph.length-1)),deal:dealId,s:1,x:0,y:0,ptrs:new Map(),pinch:null,drag:null});
  const el=document.createElement('div');el.className='pv';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Photos of '+streetOf(d.address));
  el.innerHTML=`<div class="pv-top"><span class="pv-count" aria-live="polite"></span><span class="pv-sp"></span>
      <button class="pv-b pv-mk" data-pv="marks" aria-pressed="true">Marks</button>
      <button class="pv-b" data-pv="out" aria-label="Zoom out">−</button><button class="pv-b" data-pv="reset" aria-label="Fit to screen">Fit</button><button class="pv-b" data-pv="in" aria-label="Zoom in">+</button>
      <button class="pv-b" data-pv="fs" aria-label="Full screen">${ico('expand')}</button><button class="pv-b" data-pv="close" aria-label="Close">${ico('close')}</button></div>
    <div class="pv-stage"><div class="pv-frame"><img class="pv-img" alt="" draggable="false"><div class="pv-marks"></div></div></div>
    <button class="pv-nav prev" data-pv="prev" aria-label="Previous photo">${ico('back')}</button><button class="pv-nav next" data-pv="next" aria-label="Next photo">${ico('back')}</button>
    <div class="pv-foot"><span class="pv-note"></span><div class="pv-strip">${ph.map((p,k)=>`<button data-pv="go" data-i="${k}" aria-label="Photo ${k+1}"><img src="${esc(p.src)}" alt="" loading="lazy"></button>`).join('')}</div></div>`;
  document.body.appendChild(el);PV.el=el;PV.prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
  el.addEventListener('click',pvClick);
  const st=el.querySelector('.pv-stage');
  st.addEventListener('wheel',pvWheel,{passive:false});st.addEventListener('dblclick',pvDbl);
  st.addEventListener('pointerdown',pvDown);st.addEventListener('pointermove',pvMove);st.addEventListener('pointerup',pvUp);st.addEventListener('pointercancel',pvUp);
  document.addEventListener('keydown',pvKey);window.addEventListener('resize',pvApply);
  pvShow();setTimeout(()=>{const b=el.querySelector('[data-pv="close"]');if(b)b.focus()},0);
}
function closeViewer(){if(!PV.el)return;document.removeEventListener('keydown',pvKey);window.removeEventListener('resize',pvApply);
  try{if(document.fullscreenElement===PV.el)document.exitFullscreen()}catch(e){}
  PV.el.remove();PV.el=null;document.body.style.overflow=PV.prevOverflow||'';
  if(state.view==='deal'&&PV.deal===state.dealId){PIDX[PV.deal]=PV.i;render()}}
function pvShow(){
  const el=PV.el;if(!el)return;const p=PV.list[PV.i];const n=PV.list.length;const d=state.deals[PV.deal]||{};
  PV.s=1;PV.x=0;PV.y=0;const img=el.querySelector('.pv-img');img.src=p.src;img.alt=`Photo ${PV.i+1} of ${n}`;
  const mk=photoMarks(d,p.id);
  el.querySelector('.pv-count').textContent=`${PV.i+1} / ${n}`;
  el.querySelector('.pv-marks').innerHTML=mk.map(m=>`<div class="pv-ring${m.y<0.07?' lb':''}" style="left:${(m.x*100).toFixed(2)}%;top:${(m.y*100).toFixed(2)}%;width:${(m.w*100).toFixed(2)}%;height:${(m.h*100).toFixed(2)}%"><span>${esc(m.label)}</span></div>`).join('');
  const mb=el.querySelector('.pv-mk');mb.hidden=!mk.length;mb.setAttribute('aria-pressed',String(PV.marks));el.querySelector('.pv-marks').hidden=!PV.marks;
  el.querySelector('.pv-note').textContent=mk.length?`${negName()} marked ${mk.length} issue${mk.length>1?'s':''} in this photo (areas are approximate).`:'';
  el.querySelectorAll('.pv-nav').forEach(b=>b.hidden=n<2);
  el.querySelectorAll('.pv-strip button').forEach((b,k)=>{b.classList.toggle('on',k===PV.i);if(k===PV.i){b.setAttribute('aria-current','true');try{b.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}}else b.removeAttribute('aria-current')});
  pvApply();
}
function pvGo(k){const n=PV.list.length;PV.i=((k%n)+n)%n;pvShow()}
function pvClamp(){const el=PV.el;if(!el)return;const st=el.querySelector('.pv-stage');const fr=el.querySelector('.pv-frame');
  const W=st.clientWidth,H=st.clientHeight,w=fr.offsetWidth*PV.s,h=fr.offsetHeight*PV.s;const mx=Math.max(0,(w-W)/2),my=Math.max(0,(h-H)/2);
  PV.x=Math.max(-mx,Math.min(mx,PV.x));PV.y=Math.max(-my,Math.min(my,PV.y));if(PV.s<=1){PV.s=1;PV.x=0;PV.y=0}}
function pvApply(){const el=PV.el;if(!el)return;pvClamp();const fr=el.querySelector('.pv-frame');fr.style.transform=`translate(${PV.x}px,${PV.y}px) scale(${PV.s})`;el.querySelector('.pv-stage').classList.toggle('zoomed',PV.s>1)}
/* zoom keeping the point under the cursor (cx, cy from the stage center) in place */
function pvZoomTo(s2,cx,cy){s2=Math.max(1,Math.min(8,s2));const s=PV.s;PV.x=cx-(cx-PV.x)*s2/s;PV.y=cy-(cy-PV.y)*s2/s;PV.s=s2;pvApply()}
function pvCenterOf(e){const r=PV.el.querySelector('.pv-stage').getBoundingClientRect();return [e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2]}
function pvWheel(e){e.preventDefault();const [cx,cy]=pvCenterOf(e);pvZoomTo(PV.s*Math.exp(-e.deltaY*0.0015),cx,cy)}
function pvDbl(e){const [cx,cy]=pvCenterOf(e);if(PV.s>1){PV.s=1;pvApply()}else pvZoomTo(3,cx,cy)}
function pvDown(e){if(e.button>0)return;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}PV.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PV.ptrs.size===2){const [a,b]=[...PV.ptrs.values()];PV.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:PV.s,c:pvCenterOf({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2})};PV.drag=null}
  else PV.drag={x:e.clientX,y:e.clientY,ox:PV.x,oy:PV.y,moved:0}}
function pvMove(e){if(!PV.ptrs.has(e.pointerId))return;PV.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PV.pinch&&PV.ptrs.size>=2){const [a,b]=[...PV.ptrs.values()];const dd=Math.hypot(a.x-b.x,a.y-b.y);const s2=Math.max(1,Math.min(8,PV.pinch.s*dd/PV.pinch.d));const [cx,cy]=PV.pinch.c;PV.x=cx-(cx-PV.x)*s2/PV.s;PV.y=cy-(cy-PV.y)*s2/PV.s;PV.s=s2;pvApply();return}
  const g=PV.drag;if(!g)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;g.moved=Math.max(g.moved,Math.abs(dx),Math.abs(dy));
  if(PV.s>1){PV.x=g.ox+dx;PV.y=g.oy+dy;pvApply()}}
function pvUp(e){const g=PV.drag;PV.ptrs.delete(e.pointerId);if(PV.ptrs.size<2)PV.pinch=null;
  if(g&&PV.s<=1&&PV.ptrs.size===0){const dx=e.clientX-g.x;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(e.clientY-g.y))pvGo(PV.i+(dx<0?1:-1))}
  if(PV.ptrs.size===0)PV.drag=null}
function pvKey(e){if(!PV.el)return;const k=e.key;
  if(k==='Escape'){e.preventDefault();if(document.fullscreenElement===PV.el){try{document.exitFullscreen()}catch(x){}}else closeViewer()}
  else if(k==='ArrowRight'){e.preventDefault();pvGo(PV.i+1)}else if(k==='ArrowLeft'){e.preventDefault();pvGo(PV.i-1)}
  else if(k==='+'||k==='='){pvZoomTo(PV.s*1.4,0,0)}else if(k==='-'){pvZoomTo(PV.s/1.4,0,0)}else if(k==='0'){PV.s=1;pvApply()}}
function pvClick(e){const b=e.target.closest('[data-pv]');if(!b)return;const a=b.dataset.pv;
  if(a==='close')closeViewer();else if(a==='prev')pvGo(PV.i-1);else if(a==='next')pvGo(PV.i+1);else if(a==='go')pvGo(+b.dataset.i);
  else if(a==='in')pvZoomTo(PV.s*1.5,0,0);else if(a==='out')pvZoomTo(PV.s/1.5,0,0);else if(a==='reset'){PV.s=1;pvApply()}
  else if(a==='marks'){PV.marks=!PV.marks;pvShow()}
  else if(a==='fs'){try{if(document.fullscreenElement)document.exitFullscreen();else if(PV.el.requestFullscreen)PV.el.requestFullscreen().catch(()=>{})}catch(x){}}}

/* ================= deal score, comps, rental (deal page cards) ================= */
function scoreTag(d){const S=dealScore(d);if(!S)return '';const theirs=arvTheirs(d)||rehabTheirs(d);return `<span class="tag score ${theirs?'slate':S.grade[1]}" title="Deal score at ${money(S.basis)}${theirs?', using the seller’s own ARV/repair numbers':''}">${S.score} · ${esc(STRAT_LABEL[S.best])}${theirs?' <small style="font-size:.45em;font-weight:700;opacity:.8">on their numbers</small>':''}</span>`}
function scoreRing(score,cls){const r=34,C=2*Math.PI*r,f=Math.max(0,Math.min(100,score))/100;return `<svg class="ring ${cls}" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" class="ring-bg"/><circle cx="42" cy="42" r="${r}" class="ring-fg" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle">${score}</text></svg>`}
function scoreCard(d,c){
  if(!c.ready)return '';const S=dealScore(d,null,true);if(!S)return '';const n=esc(negName());const L=curList(d);
  const basisLab=lastTheirPrice(d)!=null?'their last number':d.source==='wholesaler'?'the asking price':'the list price';

  const at80=S.at80;let line='';

  else if(at80==null)line='Doesn’t reach 80 at any price with these numbers. Check the ARV and repairs.';

  <div class="score-top">${scoreRing(S.score,S.grade[1])}<div style="min-width:0"><div class="row" style="gap:8px"><span class="pill ${S.grade[1]==='blue'?'blue':S.grade[1]==='amber'?'orange':S.grade[1]}">${esc(S.grade[0])}</span><b>Best exit: ${esc(STRAT_LABEL[S.best])}</b></div><p class="small" style="margin-top:6px">${line}</p><p class="xs muted">80+ is the bar a lender or partner would fund. 85+ is a bonanza.</p></div></div>
  <div class="srows">${row('flip','Fix & flip')}${row('brrrr','BRRRR')}${row('wholesale','Wholesale')}${row('rental','Rental (all cash)')}</div>
  ${!S.strat.brrrr?`<p class="small muted">Add the market rent (Rental analysis) to score BRRRR and rental too.</p>`:''}
  ${S.mods.length?`<div class="mods">${S.mods.map(m=>`<span class="tag ${m[1]<=-8?'red':'orange'}">${m[1]} · ${esc(m[0])}</span>`).join('')}</div>`:'<p class="small muted">No risk deductions: comps back the ARV and nothing looks off.</p>'}
  </section>`;

const COMP_ST={sold:['Sold','red'],for_sale:['For sale','green'],pending:['Pending','orange']};
function compsCard(d,c){

  const arvBlock=g.rows.length?`<div class="arvline"><div class="seg" role="group" aria-label="ARV method">${[['smart','Smart ARV'],['median','Median']].map(([v,l])=>`<button data-act="arv-mode" data-v="${v}" aria-pressed="${mode===v}">${l}</button>`).join('')}</div>

/* a small map drawn from the comps' coordinates, centered on the subject */
function compMapSVG(d,g){
  const pts=g.rows.filter(r=>r.x.lat&&r.x.lng);if(!pts.length)return '';
  let lat0=d.lat,lng0=d.lng,approx=false;
  if(!(lat0&&lng0)){lat0=median(pts.map(r=>r.x.lat));lng0=median(pts.map(r=>r.x.lng));approx=true}
  const k=Math.cos(lat0*Math.PI/180);const mi=r=>({x:(r.x.lng-lng0)*69.17*k,y:(r.x.lat-lat0)*69.17});
  const P=pts.map(r=>Object.assign({r},mi(r)));const core=P.filter(p=>!p.r.x.skip);const maxR=Math.max(.3,...(core.length?core:P).map(p=>Math.hypot(p.x,p.y)))*1.1;
  for(const p of P){const h=Math.hypot(p.x,p.y);p.far=h>maxR;if(p.far){p.miles=h;p.x=p.x/h*maxR;p.y=p.y/h*maxR}}
  const W=560,H=340,cx=W/2,cy=H/2,sc=(H/2-18)/maxR;
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="cmap" role="img" aria-label="Map of comps around the subject">`;
  for(const ring of [.25,.5,1,2,3,5])if(ring<=maxR&&ring*sc>=26)svg+=`<circle cx="${cx}" cy="${cy}" r="${(ring*sc).toFixed(1)}" class="cm-ring"/><text x="${cx+ring*sc*.71+3}" y="${cy-ring*sc*.71-3}" class="cm-lab">${ring} mi</text>`;
  svg+=`<text x="${W-14}" y="22" class="cm-lab" text-anchor="end">N ↑</text>`;
  for(const p of P.sort((a,b)=>a.r.match-b.r.match)){const r=p.r;const x=cx+p.x*sc,y=cy-p.y*sc;const cls=r.st!=='sold'?r.st:r.reno?'sold':'asis';
    svg+=`<g class="cm-pt ${cls}${r.x.skip?' off':''}${r===g.sup?' sup':''}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r===g.sup?11:9}"/><text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle">${r.i+1}</text>${p.far?`<text class="cm-far" x="${(x+(p.x>=0?12:-12)).toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="${p.x>=0?'start':'end'}">${p.miles.toFixed(1)} mi →</text>`:''}<title>${esc((r.x.addr||'comp')+' · '+money(r.price)+(r.psf?' · $'+Math.round(r.psf)+'/sqft':''))}</title></g>`}
  svg+=`<path class="cm-star" d="${starPath(cx,cy,12,5)}"/></svg>`;
  return `<div class="cmap-wrap">${svg}<div class="cm-legend"><span><i class="star"></i>Subject${approx?' (approximate)':''}</span><span><i class="sold"></i>Sold, renovated</span><span><i class="asis"></i>Sold as-is</span><span><i class="for_sale"></i>For sale</span><span><i class="pending"></i>Pending</span><span><i class="supx"></i>Super comp</span>${approx?`<button class="linkbtn" data-act="geo-subject">Locate the subject</button>`:''}</div></div>`;
}
function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rad=i%2?R*.45:R;p+=(i?'L':'M')+(cx+Math.cos(a)*rad).toFixed(1)+','+(cy+Math.sin(a)*rad).toFixed(1)}return p+'Z'}

/* ---------- CSV import (Redfin "Download All", PropStream and similar) ---------- */
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=ch}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
const looksCSV=t=>{const l=String(t||'').split(/\r?\n/)[0]||'';return (l.match(/,/g)||[]).length>=4&&/address/i.test(l)};
function csvRecords(t){const rows=parseCSV(String(t).replace(/^﻿/,''));if(rows.length<2)return [];const h=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
function col(o,keys){for(const k of keys){if(o[k]!=null&&o[k]!=='')return o[k]}for(const k of keys){const kk=Object.keys(o).find(x=>x.startsWith(k+' ')||x.startsWith(k+'('));if(kk&&o[kk]!=='')return o[kk]}return ''}
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
function csvDate(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^([A-Za-z]+)[-\s](\d{1,2}),?[-\s](\d{4})$/);if(m){const mo=MONTHS.findIndex(x=>x.startsWith(m[1].toLowerCase().slice(0,3)));if(mo>=0)return `${m[3]}-${String(mo+1).padStart(2,'0')}-${m[2].padStart(2,'0')}`}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];const t=new Date(s);return isNaN(t)?'':t.toISOString().slice(0,10)}
function csvStatus(o){const s=(col(o,['status','listing status','sale type'])||'').toLowerCase();if(/pend|contingent|under contract/.test(s))return 'pending';if(/sold|past sale|closed/.test(s))return 'sold';if(/active|for sale|coming|mls listing|new/.test(s))return 'for_sale';return col(o,['sold date','sale date','last sale date','close date','closing date'])?'sold':'for_sale'}
function haversine(a,b,c,d2){const R=3958.8,t=x=>x*Math.PI/180;const dl=t(c-a),dg=t(d2-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const normAddr=s=>String(s||'').toLowerCase().replace(/\(example\)/,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(street|st|avenue|ave|road|rd|drive|dr|lane|ln|court|ct|boulevard|blvd|place|pl|circle|cir|trail|trl|way)\b/g,'').replace(/\s+/g,' ').trim();
async function geocodeDeal(d){
  if(d.lat&&d.lng)return true;const q=[streetOf(d.address),d.city,d.state,d.zip].filter(Boolean).join(', ');if(!q)return false;
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});const j=await r.json();if(j&&j[0]){d.lat=+j[0].lat;d.lng=+j[0].lon;return true}}catch(e){}
  return false;
}
async function importCompsCSV(id,text){
  const d=state.deals[id];if(!d)return;const recs=csvRecords(text);
  const subj=normAddr(streetOf(d.address));const got=[];
  for(const o of recs){
    const addr=col(o,['address','street address','property address','street','site address']);const price=parseNum(col(o,['price','sold price','sale price','last sale price','close price','list price','listing price']));
    if(!addr||!price)continue;if(subj&&normAddr(addr)===subj){const la=parseNum(col(o,['latitude','lat'])),lo=parseNum(col(o,['longitude','lng','lon']));if(la&&lo){d.lat=la;d.lng=lo}continue}
    got.push({addr,price,sqft:parseNum(col(o,['square feet','sqft','sq ft','living area','building sqft','living sqft'])),beds:parseNum(col(o,['beds','bedrooms','bd'])),baths:parseNum(col(o,['baths','bathrooms','total baths','ba'])),
      year:parseNum(col(o,['year built'])),soldDate:csvDate(col(o,['sold date','sale date','last sale date','close date','closing date'])),status:csvStatus(o),lat:parseNum(col(o,['latitude','lat'])),lng:parseNum(col(o,['longitude','lng','lon'])),url:col(o,['url']),dom:parseNum(col(o,['days on market'])),dist:parseNum(col(o,['distance','miles']))});
  }
  if(!got.length){toast('No comps found in that file. It needs at least an address and a price column.',5200);return}
  if(!(d.lat&&d.lng)&&got.some(x=>x.lat))await geocodeDeal(d);
  for(const x of got)if(x.dist==null&&d.lat&&x.lat)x.dist=Math.round(haversine(d.lat,d.lng,x.lat,x.lng)*100)/100;
  const soldPsf=median(got.filter(x=>x.status==='sold'&&x.sqft).map(x=>x.price/x.sqft));
  for(const x of got){if(x.status==='sold'&&soldPsf&&x.sqft){x.reno=x.price/x.sqft>=soldPsf*.72;x.renoAuto=true}else x.reno=true;
    const age=x.soldDate?(Date.now()-new Date(x.soldDate).getTime())/(30*DAY):null;x.skip=x.status==='sold'&&((x.dist!=null&&x.dist>1.5)||(age!=null&&age>12))}
  got.sort((a,b)=>(a.status==='sold'?0:1)-(b.status==='sold'?0:1)||(a.dist??9)-(b.dist??9)||String(b.soldDate).localeCompare(String(a.soldDate)));
  const have=new Set((d.comps||[]).map(x=>normAddr(x.addr)));const add=got.filter(x=>!have.has(normAddr(x.addr))).slice(0,40);
  d.comps=(d.comps||[]).concat(add);saveDeal(d);
  const s=add.filter(x=>x.status==='sold').length;toast(`Imported ${add.length} comp${add.length===1?'':'s'}: ${s} sold, ${add.length-s} for sale or pending${d.lat?'':'. Couldn’t locate the subject, so distances are missing'}.`,5200);
}

function histEvents(d){

  const ph=(d.priceHistory||[]).filter(p=>p&&p.date&&p.price);
  ph.forEach((p,i)=>{const date=isoDay(p.date);const kind=i===0?'listed':p.price<ph[i-1].price?'price_cut':p.price>ph[i-1].price?'price_up':null;if(!kind)return;

function historyInsights(d){

/* ================= Dictation: talk, and it types into the box ================= */
/* Any <textarea data-dict> gets a mic button. Words appear as you speak; you still press Send. */
const DICT={id:null,rec:null,want:false,base:'',final:'',interim:'',ends:[],quietT:0};
const DICT_QUIET=25;/* stop listening after this many seconds with no speech */
function dictDecorate(){
  if(DICT.want&&!document.getElementById(DICT.id))dictStop();
  document.querySelectorAll('textarea[data-dict]').forEach(t=>{
    if(t.parentElement&&t.parentElement.classList.contains('dict-wrap'))return;
    const w=document.createElement('span');w.className='dict-wrap'+(t.rows<=1?' one':'');t.parentNode.insertBefore(w,t);w.appendChild(t);
    const b=document.createElement('button');b.type='button';b.className='dict-btn';b.dataset.act='dict';b.dataset.k=t.id;w.appendChild(b);
  });
  dictBits();
}
function dictBits(){
  document.querySelectorAll('.dict-btn').forEach(b=>{const on=DICT.want&&b.dataset.k===DICT.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));
    const lab=on?'Stop talking':'Talk instead of typing';b.setAttribute('aria-label',lab);b.title=on?'Listening… tap to stop':'Talk, and it types for you';b.innerHTML=ico(on?'stop':'mic')});
}
function dictToggle(id){
  if(DICT.want&&DICT.id===id){dictStop();return}
  dictStop();
  if(!SR()){toast('Talking needs Chrome, Edge or Safari. You can still type.',5200);return}
  if(typeof VOICE!=='undefined'&&VOICE.listening)voiceStopListening();
  const box=document.getElementById(id);if(!box)return;
  Object.assign(DICT,{id,want:true,base:box.value.replace(/\s+$/,''),final:'',interim:'',ends:[]});
  dictStart();dictBits();dictQuiet();
  try{box.focus({preventScroll:true});box.setSelectionRange(box.value.length,box.value.length)}catch(e){}
}
function dictStart(){
  const R=SR();if(!R||!DICT.want)return;
  if(DICT.rec){try{DICT.rec.onend=null;DICT.rec.abort()}catch(e){}}
  const r=new R();r.lang='en-US';r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
  r.onresult=e=>{if(!DICT.want||DICT.rec!==r)return;let int='';let got=false;
    for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){DICT.final=(DICT.final+' '+x[0].transcript).trim();got=true}else int+=x[0].transcript}
    DICT.interim=int.trim();dictWrite(got);dictQuiet()};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){dictStop();toast('Allow the microphone for this site in your browser, then tap the mic again.',6000)}else if(e.error==='audio-capture'){dictStop();toast('No microphone found.',4200)}};
  r.onend=()=>{if(DICT.rec===r)DICT.rec=null;if(!DICT.want)return;const now=Date.now();DICT.ends=DICT.ends.filter(t=>now-t<6000).concat(now);setTimeout(()=>{if(DICT.want&&!DICT.rec)dictStart()},DICT.ends.length>5?1200:150)};
  try{r.start();DICT.rec=r}catch(e){dictStop();toast('Couldn’t start the microphone.',4200)}
}
function dictText(){const said=[DICT.final,DICT.interim].filter(Boolean).join(' ');return said?(DICT.base?DICT.base+(/[\n]$/.test(DICT.base)?'':' '):'')+said:DICT.base}
function dictWrite(save){
  const box=document.getElementById(DICT.id);if(!box)return;
  box.value=dictText();box.scrollTop=box.scrollHeight;
  box.dispatchEvent(new Event('input',{bubbles:true}));
  if(save&&!box.hasAttribute('data-draft'))box.dispatchEvent(new Event('change',{bubbles:true}));
}
function dictQuiet(){clearTimeout(DICT.quietT);DICT.quietT=setTimeout(()=>{if(DICT.want)dictStop()},DICT_QUIET*1000)}
function dictStop(){
  if(!DICT.want&&!DICT.rec)return;
  const had=DICT.interim;DICT.want=false;clearTimeout(DICT.quietT);
  if(DICT.rec){try{DICT.rec.onend=null;DICT.rec.abort()}catch(e){}DICT.rec=null}
  if(had){DICT.final=(DICT.final+' '+had).trim();DICT.interim=''}
  if(had||DICT.final)dictWrite(true);
  dictBits();
}

const VOICE={rec:null,listening:false,speaking:false,audio:null,interim:'',final:'',voices:null,err:''};

function voiceStart(){
  const R=SR();if(!R||!VOICE.want)return;if(VOICE.rec){try{VOICE.rec.onend=null;VOICE.rec.abort()}catch(e){}}
  const r=new R();r.lang='en-US';r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
  r.onresult=e=>{let int='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)VOICE.final=(VOICE.final+' '+x[0].transcript).trim();else int+=x[0].transcript}
    VOICE.interim=int.trim();voiceHeard()};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){VOICE.want=false;VOICE.err='Allow the microphone for this site in your browser, then try again.'}else if(e.error==='audio-capture'){VOICE.want=false;VOICE.err='No microphone found.'}voiceBits()};
  r.onend=()=>{VOICE.rec=null;if(VOICE.want&&!VOICE.sending){const now=Date.now();VOICE.ends=(VOICE.ends||[]).filter(t=>now-t<6000).concat(now);setTimeout(()=>{if(VOICE.want&&!VOICE.rec)voiceStart()},VOICE.ends.length>5?1200:150);return}VOICE.listening=false;voiceBits()};

function voiceHeard(){

function stopSpeaking(){VOICE.tok=(VOICE.tok||0)+1;if(VOICE.audio){const a=VOICE.audio;a.onended=a.onerror=null;try{a.pause()}catch(e){}VOICE.audio=null}try{speechSynthesis.cancel()}catch(e){}VOICE.speaking=false}
/* agents sometimes write stage directions ("*sighs, sounding busy*"); never read those out loud */
const CUE_RE=/^(?:[a-z]+ly\s+)?(sigh|laugh|chuckl|pause|paus|clear|groan|exhal|inhal|smil|grin|frown|sound|tone|beat|scoff|typ|mutter|lean|shuffl|hesitat|cough|snort|whisper|nod|shrug|rustl|sip|tap|look|glanc|wince|rais|lower|speak|say|said|voice|busy|annoy|irritat|impatient|warm|friend|curt|flat|dry|skeptic|interrupt|over|chuckling|laughing|sighing)/i;
function cleanSpoken(t,forV3){
  let s=String(t||'');
  const tag=c=>{if(!forV3)return ' ';const m=String(c).toLowerCase();return m.includes('sigh')?' [sighs] ':/laugh|chuckl/.test(m)?' [laughs] ':m.includes('whisper')?' [whispers] ':' '};
  s=s.replace(/\*{1,2}([^*\n]{1,140})\*{1,2}/g,(_,c)=>tag(c));
  s=s.replace(/\[([^\]\n]{1,80})\]/g,(_,c)=>forV3&&/^(sighs|laughs|whispers)$/i.test(c.trim())?' ['+c.trim().toLowerCase()+'] ':tag(c));
  s=s.replace(/\(([^)\n]{1,90})\)/g,(m,c)=>CUE_RE.test(c.trim())&&!/\d/.test(c)?tag(c):m);
  s=s.replace(/(^|\n)\s*_([^_\n]{1,120})_\s*/g,(m,a,c)=>CUE_RE.test(c.trim())?a+tag(c):m);
  s=s.replace(/^\s*[A-Z][a-z]+(?: [A-Z][a-z]+)?:\s+/,'');
  return s.replace(/[ \t]{2,}/g,' ').replace(/\s+([,.!?])/g,'$1').replace(/^[\s,.]+/,'').trim();
}
async function speakAgent(text,persona){
  text=String(text||'');if(!state.voiceOn||!cleanSpoken(text))return;stopSpeaking();const tok=VOICE.tok;VOICE.speaking=true;voiceBits();
  const done=()=>{if(tok!==VOICE.tok)return;VOICE.tok++;VOICE.speaking=false;VOICE.audio=null;voiceBits();if(state.voiceOn&&voiceSet().handsFree!==false&&state.practiceId&&!(state.practice[state.practiceId]||{}).feedback)setTimeout(voiceListen,250)};
  const key=secrets().elevenKey;const V=voiceSet();
  if(key){
    const vid=(V.voices&&V.voices[persona])||V.voice||DEFAULT_VOICE;
    const call=model=>fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(vid)}?output_format=mp3_44100_128`,{method:'POST',headers:{'xi-api-key':key,'content-type':'application/json',accept:'audio/mpeg'},body:JSON.stringify(Object.assign({text:cleanSpoken(text,model==='eleven_v3').slice(0,2500)},model?{model_id:model}:{}))});
    try{
      let r=await call(V.model||'eleven_flash_v2_5');if(!r.ok&&(r.status===400||r.status===422||r.status===404))r=await call(null);
      if(!r.ok){let m='';try{const j=await r.json();m=(j.detail&&(j.detail.message||j.detail.status))||''}catch(e){}throw new Error(r.status===401?'ElevenLabs rejected the API key.':m||('ElevenLabs error '+r.status))}
      const blob=await r.blob();if(tok!==VOICE.tok)return;const url=URL.createObjectURL(blob);const au=new Audio(url);VOICE.audio=au;
      au.onended=()=>{URL.revokeObjectURL(url);done()};au.onerror=()=>{URL.revokeObjectURL(url);done()};
      await au.play();return;
    }catch(e){if(tok!==VOICE.tok)return;VOICE.err=String(e.message||e)+' Using the browser voice instead.'}
  }
  try{const u=new SpeechSynthesisUtterance(cleanSpoken(text));u.lang='en-US';u.rate=1.03;const vs=speechSynthesis.getVoices().filter(v=>/en-US/i.test(v.lang));if(vs.length)u.voice=vs[(persona||'').length%vs.length];u.onend=done;u.onerror=done;speechSynthesis.speak(u)}catch(e){done()}
}

function buildBrief(){
  const ds=Object.values(state.deals).filter(d=>!d.example&&!['dead','closed'].includes(d.stage));const now=Date.now();
  const a=d=>streetOf(d.address)||'Untitled deal';const k=counts();

  return `${brain}${spendCardHTML()}<div class="split">${gmail}${phone}</div>${cloudCardHTML()}${workerCardHTML()}`;
}

/* ================= Market Discovery: every US ZIP ranked for how you invest ================= */
const DISC={data:null,loading:null,err:'',weekly:null,byZip:{}};
const MK_STRATS={flip:'Fix & flip',wholesale:'Wholesale',brrrr:'BRRRR / rental'};
/* what each strategy cares about (weights add to 100) */
const MK_W={
  flip:{volume:20,speed:20,exit:15,trend:20,supply:10,leverage:10,stability:5},
  wholesale:{volume:20,leverage:20,investors:15,speed:15,trend:10,supply:10,yield:10},
  brrrr:{yield:35,trend:15,volume:10,supply:10,leverage:10,speed:10,stability:5,exit:5}
};
const MK_SUB={
  volume:['Sales volume','Homes sold in the last 3 months. More sales means more deals and easier exits.'],
  speed:['Speed','Median days on market.'],
  exit:['Exit strength','Sale-to-list ratio and share of homes under contract within 2 weeks.'],
  trend:['Price trend','Change in median price and $/sqft over a year.'],
  supply:['Balance','Months of supply. 2.5 to 5 months is the sweet spot for buying and selling.'],
  leverage:['Motivated sellers','Share of listings with a price cut, and listings pulled off the market.'],
  stability:['Deal stability','Share of pending sales that fall through (lower is better).'],
  yield:['Rent yield','Yearly rent ÷ median sale price (HUD 3-bed rent, else Zillow typical rent).'],
  investors:['Investor demand','Investors’ share of home purchases in the metro: the cash buyers you sell to.']

const mkSet=()=>state.settings.markets;
function mkStrat(){const s=mkSet().strategy;if(MK_W[s])return s;const b=state.settings.buy.strategy;return b==='wholesale'?'wholesale':(b==='brrrr'||b==='rental')?'brrrr':'flip'}
const US_STATES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'Washington DC',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico'};
const stName=c=>US_STATES[c]||c||'';
/* "Ocala, FL" -> "Ocala, Florida"; "Bristol, TN-VA" -> "Bristol, Tennessee / Virginia" */
const stFull=s=>String(s||'').replace(/,\s*([A-Z]{2}(?:-[A-Z]{2})*)$/,(m,c)=>', '+c.split('-').map(stName).join(' / '));
/* the state filter takes codes or names: "OH, TX" or "Ohio, Texas" */
function mkStates(){
  const out=new Set();const byName={};for(const [c,n] of Object.entries(US_STATES))byName[n.toLowerCase()]=c;
  for(const t of String(mkSet().states||'').split(/[,;/\n]+/).map(x=>x.trim()).filter(Boolean)){
    const u=t.toUpperCase();if(/^[A-Z]{2}$/.test(u)&&US_STATES[u]){out.add(u);continue}
    const c=byName[t.toLowerCase()];if(c){out.add(c);continue}
    for(const w of u.split(/[^A-Z]+/))if(/^[A-Z]{2}$/.test(w)&&US_STATES[w])out.add(w);

/* Rowhouse / townhouse data (Philadelphia, Baltimore...) lives on its own branch. Its metros get their own keys and labels,
   so a starred "Philadelphia (rowhouses)" never mixes with single-family Philadelphia. */
const TH_SUF=' · rowhouses';const TH_BASE='https://raw.githubusercontent.com/ItzEzi/offerdesk/data-townhouse/market/';
const mkIsTh=k=>String(k||'').endsWith(TH_SUF);const mkBase=k=>mkIsTh(k)?String(k).slice(0,-TH_SUF.length):k;
const mkPtype=()=>mkSet().ptype==='th'?'th':'sfr';
const mkKind=()=>mkPtype()==='th'?'rowhouse and townhouse':'single-family';
const mkLabel=k=>{if(!k)return '';if(mkIsTh(k))return mkLabel(mkBase(k))+' (rowhouses)';return k[0]==='~'?`Outside metro areas, ${stName(k.slice(1))}`:stFull(k.replace(/\s+metro area$/i,''))};
/* HUD's small-area rent has floors that overstate rent in the cheapest ZIPs, so cap it near Zillow's typical rent when both exist */
const mkRent=o=>o.fmr3!=null&&o.zori!=null?Math.min(o.fmr3,Math.round(o.zori*1.3)):o.fmr3??o.zori??null;
const mkYield=o=>{const r=mkRent(o);return r&&o.price?r*12/o.price:null};

/* townhouse data: its own index and files, fetched without touching MKT.base (deal pages keep single-family data) */
const THX={idx:null,at:0};
async function thFetch(path){try{const r=await fetch(TH_BASE+path,{cache:'no-cache'});if(r.ok)return await r.json()}catch(e){}return null}

function mkSetPtype(v){
  const M=mkSet();const t=v==='th'?'th':'sfr';if(mkPtype()===t)return;
  M.ptype=t;DISC.data=null;DISC.byZip={};DISC.weekly=null;DISC.err='';DISC.zhviMonth=null;MKC.key='';state.mk.metro=null;state.mk.zip=null;state.mk.show=25;
  saveSettings();render();loadDiscover();
}
async function loadDiscover(){
  if(DISC.data&&DISC.ptype===mkPtype())return DISC.data;if(DISC.loading)return DISC.loading;
  DISC.err='';
  const th=mkPtype()==='th';const get=th?thFetch:mktFetch;
  DISC.loading=(async()=>{
    const idx=th?await thIndex():await marketIndex();const f=idx&&idx.discover&&idx.discover.file;
    if(!f){DISC.err=th?'The rowhouse and townhouse data isn’t published yet. Switch back to houses, or try again later.':idx?'The market data job hasn’t published the national table yet. It runs every Wednesday.':'Couldn’t reach the market data. Check your connection and reload.';return null}
    const cf=idx.census&&idx.census.file,xf=idx.crosscheck&&idx.crosscheck.file;
    const [j,wk,cz,cx]=await Promise.all([get(f+'?v='+encodeURIComponent(idx.updated||'')),get('metros.json?v='+encodeURIComponent(idx.updated||'')),cf?get(cf+'?v='+encodeURIComponent(idx.updated||'')):null,xf?get(xf+'?v='+encodeURIComponent(idx.updated||'')).catch(()=>null):null]);
    if(!j||!Array.isArray(j.rows)){DISC.err='Couldn’t load the market data. Check your connection and reload.';return null}
    if(th!==(mkPtype()==='th'))return null;/* he switched home type while this was loading */
    const C=j.cols;const rows=[];const byZip={};const suf=th?TH_SUF:'';
    for(const r of j.rows){const o={};for(let i=0;i<C.length;i++)o[C[i]]=r[i];o.metro=j.metros[o.mi]||'';o.mk=(o.metro||'~'+o.st)+suf;byZip[o.z]=o;if(o.price)rows.push(o)}
    const wkm=wk&&wk.metros||{};
    DISC.data={...j,rows};DISC.ptype=th?'th':'sfr';DISC.byZip=byZip;DISC.weekly=suf?Object.fromEntries(Object.entries(wkm).map(([k,v])=>[k+suf,v])):wkm;MKC.key='';
    try{joinCensus(cz,byZip)}catch(e){console.warn('census',e)}
    /* second opinion from Zillow: typical home value and its 12-month change (not skewed by which houses sold) */
    try{if(cx&&Array.isArray(cx.rows)&&Array.isArray(cx.cols)){const iz=cx.cols.indexOf('zhvi'),iy=cx.cols.indexOf('zhviYoy');for(const r of cx.rows){const o=byZip[r[0]];if(!o)continue;if(iz>=0)o.zhvi=r[iz];if(iy>=0)o.zhviYoy=r[iy]}DISC.zhviMonth=cx.zhviMonth||null}}catch(e){console.warn('crosscheck',e)}

  })().catch(()=>{DISC.err='Couldn’t load the market data. Check your connection and reload.';return null}).finally(()=>{DISC.loading=null;render();if(DISC.ptype!==mkPtype()&&!DISC.err)loadDiscover()});

}

/* ---- scoring ---- */
const lin=(v,a,b)=>v==null||!isFinite(v)?null:Math.max(0,Math.min(1,(v-a)/(b-a)));
const avgN=(...a)=>{const f=a.filter(x=>x!=null);return f.length?f.reduce((s,x)=>s+x,0)/f.length:null};
function mkSubs(o,inv){
  const mos=o.mos;const k=Math.min(1,(o.sold||0)/20);/* few sales = noisy medians: pull those toward neutral */
  const shrink=v=>v==null?null:.5+(v-.5)*k;
  return {
    volume:o.sold!=null?lin(Math.log(Math.max(o.sold,1)),Math.log(4),Math.log(60)):null,
    speed:shrink(lin(o.dom,95,18)),
    exit:shrink(avgN(lin(o.stl,93,100),lin(o.off2w,8,45))),
    trend:shrink(avgN(lin(o.priceYoy,-8,6),lin(o.ppsfYoy,-8,6))),
    supply:mos==null?null:mos<=2.5?.4+.6*lin(mos,.8,2.5):mos<=5?1:1-lin(mos,5,9),
    leverage:avgN(lin(o.pdPct,12,45),lin(o.delist,4,18)),
    stability:lin(o.cancel,28,8),
    yield:lin(mkYield(o),.06,.13),
    investors:inv&&inv.share!=null?lin(inv.share,10,30):null
  };
}
function mkScore(subs,w){let s=0,t=0,all=0;for(const k in w){all+=w[k];if(subs[k]!=null){s+=subs[k]*w[k];t+=w[k]}}if(!t)return null;let sc=s/t*100;const cov=t/all;if(cov<.6)sc*=.85+cov*.25;return Math.round(sc)}
function mkMetroState(k,zs){if(k[0]==='~')return k.slice(1);const m=k.match(/,\s*([A-Z]{2})\b/);return m?m[1]:(zs[0]&&zs[0].st)||''}
let MKC={key:'',res:null};
function mkCompute(){
  const D=DISC.data;if(!D)return null;const M=mkSet();const st=mkStrat();const w=MK_W[st];const states=mkStates();
  const lens=mkLens();
  const minMetro=lens==='room'?(M.minMetroSold==null||M.minMetroSold===''?300:+M.minMetroSold||0):0;
  const key=[st,lens,M.minPrice,M.maxPrice,M.minSold,minMetro,[...states].join(','),D.updated,CENS.rows,DISC.ptype].join('|');
  if(MKC.key===key)return MKC.res;
  const zips=[];
  for(const o of D.rows){
    const pass=o.price>=(+M.minPrice||0)&&o.price<=(+M.maxPrice||1e12)&&(o.sold||0)>=(+M.minSold||0)&&(!states.size||states.has(o.st))&&(st!=='brrrr'||mkRent(o)!=null);
    o.pass=pass;o.score=null;if(!pass)continue;
    o.subs=mkSubs(o,D.investors[o.metro]);o.score=mkScore(o.subs,w);if(o.score!=null)zips.push(o);
  }
  const hasRoom=roomCompute(zips,D);
  for(const o of D.rows)o.ls=null;
  for(const o of zips)o.ls=lens==='room'?(o.rm?o.rm.room:null):o.score;
  const lz=zips.filter(o=>o.ls!=null);
  const g={};for(const o of lz)(g[o.mk]=g[o.mk]||[]).push(o);
  const mScore=(zs,f)=>{const v=zs.map(f).filter(x=>x!=null).sort((a,b)=>b-a);if(!v.length)return null;const top=v.slice(0,5);return Math.round(top.reduce((s,x)=>s+x,0)/top.length*.55+median(v)*.3+Math.min(1,v.length/12)*15)};
  const metros=Object.entries(g).map(([k,zs])=>{
    zs.sort((a,b)=>b.ls-a.ls);
    const med=f=>median(zs.map(f));
    const rm=hasRoom?roomMetro(zs):null;
    return {key:k,label:mkLabel(k),st:mkMetroState(k,zs),zips:zs,n:zs.length,score:lens==='room'?(rm&&rm.room):mScore(zs,o=>o.ls),stats:mScore(zs,o=>o.score),roomScore:rm&&rm.room,sold:zs.reduce((s,o)=>s+(o.sold||0),0),
      price:med(o=>o.price),dom:med(o=>o.dom),yoy:med(o=>o.priceYoy),cuts:med(o=>o.pdPct),cancel:med(o=>o.cancel),yld:med(mkYield),inv:D.investors[mkBase(k)]||null,rm};
  }).filter(m=>m.score!=null&&(lens!=='room'||(m.key[0]!=='~'&&m.sold>=minMetro))).sort((a,b)=>b.score-a.score||b.sold-a.sold);
  metros.forEach((m,i)=>m.rank=i+1);

}
/* room scores are a balance of three things, so they run lower than strategy scores: grade them on their own scale */
const mkGrade=s=>{const r=MKC.res&&MKC.res.lens==='room';return s==null?'':s>=(r?80:80)?'green':s>=(r?75:65)?'blue':s>=(r?70:50)?'amber':'red'};
const mkPill=s=>s==null?'<span class="muted">—</span>':`<span class="scorepill ${mkGrade(s)}">${s}</span>`;
const sgn=(v,d=1)=>v==null||!isFinite(v)?'—':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d)+'%';
const pctv=(v,d=0)=>v==null||!isFinite(v)?'—':(+v).toFixed(d)+'%';

/* ---- targets ---- */
const mkTargets=()=>mkSet().targets||[];
const isTarget=(type,key)=>mkTargets().some(t=>t.type===type&&t.key===key);
function dealTarget(d){
  const T=mkTargets();if(!T.length||!d)return null;const z=zipOf(d);
  if(z&&T.some(t=>t.type==='zip'&&t.key===z))return 'zip';

function mkStar(type,key){

  if(i>=0)M.targets.splice(i,1);
  else{const o=type==='zip'?DISC.byZip[key]:null;M.targets.push({type,key,label:type==='zip'?`${key}${o&&o.city?' · '+o.city+', '+stName(o.st):''}`:mkLabel(key),metro:o?o.mk:undefined,zips:type==='metro'?Object.values(DISC.byZip).filter(x=>x.mk===key).map(x=>x.z):undefined,at:Date.now()})}

const starBtn=(type,key)=>{const on=isTarget(type,key);return `<button class="starbtn ${on?'on':''}" data-act="mk-star" data-type="${type}" data-k="${esc(key)}" aria-pressed="${on}" aria-label="${on?'Remove from':'Add to'} target markets" title="${on?'Remove from':'Add to'} target markets">${ico('star')}</button>`};

/* ---- page ---- */
function viewMarkets(){
  const D=DISC.data&&DISC.ptype===mkPtype()?DISC.data:null;const M=mkSet();const st=mkStrat();const R=D?mkCompute():null;const src=D&&D.sources||{};

/* ================= Room at the table: how much food is LEFT after the other eaters ================= */
/* A metro is a table and its listings are the food. What matters is not how many investors sit there, but how much
   they leave: listings in your price range that nobody grabbed in the first two weeks, every month (and the ones
   that had to cut their price). Then: can you still sell the finished house (exit), and is the area growing (future)?
   Investor signs (houses already rented out, metro size) are shown for background only. */
const CENS={rows:0,meta:null};
const ROOM_W={left:35,share:20,exit:20,future:25};
const ROOM_SUB={
  left:['Food left over','Listings a month in your price range that are NOT under contract within 2 weeks: the ones the other investors and buyers didn’t grab. Full marks at 150+ a month for a metro (20+ for a ZIP).'],
  share:['Share left over','Of all new listings, the share still available after 2 weeks. Higher = the eaters leave more on the table.'],
  exit:['Resale','Renovated houses still sell: days on market, months of supply, sale-to-list.'],
  future:['Future','County jobs over 2 years, population and people moving in since 2020, income growth, $/sqft over 2 years, rent growth.']
};
function joinCensus(c,byZip){
  if(!c||!Array.isArray(c.rows)||!Array.isArray(c.cols))return;
  const C=c.cols,ci={};(c.ccols||[]).forEach((k,i)=>ci[k]=i);const cs=c.counties||{};let n=0;
  for(const r of c.rows){const o=byZip[r[0]];if(!o)continue;n++;
    for(let i=1;i<C.length;i++){const k=C[i];o[k==='pop'?'zpop':k==='pop0'?'zpop0':k]=r[i]}
    const cr=o.cty&&cs[o.cty];
    if(cr){o.cPopG=cr[ci.popG];o.cPopYoy=cr[ci.popYoy];o.cMig=cr[ci.mig];o.cPop=cr[ci.pop];o.cJobYoy=cr[ci.jobYoy];o.cJob2y=cr[ci.job2y];o.cName=cr[ci.name]}}
  CENS.rows=n;CENS.mpop=null;CENS.moff=null;CENS.meta={acsYear:c.acsYear,baseYear:c.baseYear,popVintage:c.popVintage,qcew:c.qcew};
}
const roomOn=()=>CENS.rows>1000;
function mkLens(){return mkSet().lens==='room'&&roomOn()?'room':'stats'}
function wavg(pairs,minCov=.4){let s=0,t=0,all=0;for(const [v,w] of pairs){all+=w;if(v!=null&&isFinite(v)){s+=v*w;t+=w}}return t&&t/all>=minCov?s/t:null}
const gPct=(a,b)=>a!=null&&b?(a/b-1)*100:null;
const inflowOf=o=>o.sfr!=null&&o.sfr0!=null?o.sfr-o.sfr0:null;
const incGOf=o=>gPct(o.inc,o.inc0);
const jobOf=o=>o.cJob2y!=null?o.cJob2y:o.cJobYoy!=null?o.cJobYoy*2:null;
const logLin=(v,a,b)=>v==null||!isFinite(v)?null:v<=0?0:lin(Math.log(v),Math.log(a),Math.log(b));
function metroPops(D){const m={};for(const o of D.rows)if(o.zpop)m[o.mk]=(m[o.mk]||0)+o.zpop;return m}
/* typical "under contract within 2 weeks" share per metro, for small ZIPs Redfin leaves blank */
function metroOff(D){const g={};for(const o of D.rows)if(o.off2w!=null)(g[o.mk]=g[o.mk]||[]).push(o.off2w);const m={};for(const k in g)m[k]=median(g[k]);m['']=median(D.rows.map(o=>o.off2w));return m}
/* the food for one ZIP: new listings a month, and how many of them are still there after 2 weeks */
function zipFood(o,D){
  const moff=CENS.moff||(CENS.moff=metroOff(D));
  const newMo=o.newl!=null?o.newl/3:o.sold!=null?o.sold/3*1.15:null;
  const off=o.off2w!=null?o.off2w:(moff[o.mk]!=null?moff[o.mk]:moff['']);
  const left=newMo!=null&&off!=null?newMo*(1-off/100):null;
  const cut=o.inv!=null&&o.pdPct!=null?o.inv*o.pdPct/100:null;
  return {newMo,off,left,cut,estOff:o.off2w==null};
}
const exitOf=o=>wavg([[lin(o.dom,90,25),1],[o.mos==null?null:o.mos<=4?1:1-lin(o.mos,4,8),1],[lin(o.stl,92,99),1]],.34);
const futureOf=o=>wavg([[lin(jobOf(o),-2,6),25],[lin(o.cPopG,-4,8),15],[lin(o.cMig,-4,6),15],[lin(incGOf(o),8,40),15],[lin(o.ppsf2y,-5,15),20],[lin(o.zoriYoy,-1,5),10]]);
function roomScore(L,S,E,F,mos,p2y,full){
  if(L==null)return null;
  let r=ROOM_W.left*logLin(L,full?10:1,full?150:20)+ROOM_W.share*(S==null?.5:lin(S,.4,.85))+ROOM_W.exit*(E??.5)+ROOM_W.future*(F??.5);
  /* rotten food: too many unsold houses, or prices falling hard */
  if(mos!=null&&mos>8)r*=.85;
  if(p2y!=null&&p2y<-8)r*=.85;
  return Math.round(r);
}
function roomCompute(zips,D){
  if(!roomOn()||!zips.length)return false;
  CENS.mpop=CENS.mpop||metroPops(D);
  for(const o of zips){
    const f=zipFood(o,D);const exit=exitOf(o);const future=futureOf(o);
    const share=f.newMo?f.left/f.newMo:null;
    o.rm={...f,share,exit,future,room:roomScore(f.left,share,exit,future,o.mos,o.ppsf2y,false)};
  }
  return true;
}
function roomMetro(zs){
  const w=o=>Math.max(1,o.sold||1);const W=zs.reduce((s,o)=>s+w(o),0);
  const avg=f=>{let s=0,t=0;for(const o of zs){const v=f(o);if(v!=null&&isFinite(v)){s+=v*w(o);t+=w(o)}}return t/W>=.3?s/t:null};
  const sum=f=>{let s=0,n=0;for(const o of zs){const v=f(o);if(v!=null&&isFinite(v)){s+=v;n++}}return n?s:null};
  const left=sum(o=>o.rm&&o.rm.left),newMo=sum(o=>o.rm&&o.rm.newMo),cut=sum(o=>o.rm&&o.rm.cut);
  const share=left!=null&&newMo?left/newMo:null;const exit=avg(o=>o.rm&&o.rm.exit),future=avg(o=>o.rm&&o.rm.future);
  const mos=avg(o=>o.mos),p2y=avg(o=>o.ppsf2y);
  return {left,newMo,cut,share,exit,future,mos,p2y,room:roomScore(left,share,exit,future,mos,p2y,true),
    sfr:avg(o=>o.sfr),inflow:avg(inflowOf),yb:avg(o=>o.yb),own75:avg(o=>o.own75),inc:avg(incGOf),popG:avg(o=>o.cPopG),mig:avg(o=>o.cMig),job:avg(jobOf),
    full:true,rentG:avg(o=>o.zoriYoy),dom:avg(o=>o.dom),off:avg(o=>o.rm&&o.rm.off),pop:CENS.mpop&&zs[0]&&zs[0].mk[0]!=='~'?CENS.mpop[zs[0].mk]:null};
}
const p100=v=>v==null?null:Math.round(v*100);
const leftN=v=>v==null?'—':v>=10?numFmt(Math.round(v)):v.toFixed(1);
const leftTag=x=>x&&x.left!=null?`<span class="tag ${x.share>=.7?'green':x.share>=.55?'blue':'amber'}">~${leftN(x.left)} left a month</span>`:'';
function roomBars(rm){
  const v={left:logLin(rm.left,rm.full?10:1,rm.full?150:20),share:rm.share==null?null:lin(rm.share,.4,.85),exit:rm.exit,future:rm.future};
  return `<div class="mk-bars">${['left','share','exit','future'].map(k=>`<div class="mk-bar" title="${esc(ROOM_SUB[k][1])}"><span class="lab">${ROOM_SUB[k][0]} <span class="muted">· ${ROOM_W[k]}%</span></span><span class="track"><i style="width:${v[k]==null?0:Math.round(v[k]*100)}%"></i></span><b class="tnum">${v[k]==null?'n/a':Math.round(v[k]*100)}</b></div>`).join('')}</div>`;
}
const sg1=v=>v==null||!isFinite(v)?'—':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1);
function roomFacts(x,isZip){
  const rows=[
    ['New listings a month',x.newMo!=null?`~${leftN(x.newMo)}`:'—','Redfin, single-family, in the ZIPs that fit your box (3-month average).'],
    ['Grabbed within 2 weeks',x.off!=null?`${Math.round(x.off)}%${x.estOff?' (metro typical)':''}`:'—','Share of listings under contract within 2 weeks: what the eaters take fast.'],
    ['Left over a month',x.left!=null?`~${leftN(x.left)}${x.share!=null?` (${Math.round(x.share*100)}%)`:''}`:'—','Listings still available after 2 weeks: the food left on the table for you.'],
    ['With a price cut right now',x.cut!=null?`~${leftN(x.cut)}`:'—','Active listings that already cut their price: sellers who didn’t get their number.'],
    ['Jobs (county), 2 years',x.job!=null?sgn(x.job):'—','BLS covered employment.'],
    ['Population since 2020',x.popG!=null?`${sgn(x.popG)}${x.mig!=null?` · people moving in ${sgn(x.mig)}`:''}`:'—','Census population estimates; moving in = net domestic migration.'],

/* chart: share left over (x) vs food left over each month (y, log), one dot per metro */
function mkRoomChart(R){
  const ms=R.metros.filter(m=>m.key[0]!=='~'&&m.rm&&m.rm.left>0&&m.rm.share!=null).sort((a,b)=>b.sold-a.sold).slice(0,160);
  if(ms.length<5)return '';
  const narrow=window.innerWidth<640;const W=narrow?560:1000,H=narrow?520:440,L=narrow?48:56,Rr=narrow?10:14,T=16,B=narrow?50:44;const iw=W-L-Rr,ih=H-T-B;
  const xs=ms.map(m=>m.rm.share),ys=ms.map(m=>Math.log10(m.rm.left));
  const x0=Math.max(0,Math.min(...xs)-.03),x1=Math.min(1,Math.max(...xs)+.03),y0=Math.min(...ys)-.08,y1=Math.max(...ys)+.08;
  const X=v=>L+(v-x0)/(x1-x0)*iw,Y=v=>T+(1-(v-y0)/(y1-y0))*ih;
  const mx=median(xs),my=median(ys);const maxS=Math.max(...ms.map(m=>m.sold));
  const rad=m=>3+9*Math.sqrt(m.sold/maxS);
  const top=[...ms].sort((a,b)=>b.score-a.score).slice(0,8);const topSet=new Set(top.map(m=>m.key));
  const sel=state.mk.metro;const P=m=>[X(m.rm.share),Y(Math.log10(m.rm.left))];
  const dots=[...ms].sort((a,b)=>topSet.has(a.key)-topSet.has(b.key)||b.sold-a.sold).map(m=>{const [cx,cy]=P(m);const on=sel===m.key;
    return `<circle class="rc-dot${topSet.has(m.key)?' top':''}${on?' sel':''}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad(m).toFixed(1)}" style="fill:${mkColor(m.score,isDark())}" data-act="mk-metro" data-k="${esc(m.key)}"><title>${esc(m.label)}: room ${m.score} · ~${leftN(m.rm.left)} listings left over a month (${Math.round(m.rm.share*100)}%)</title></circle>`}).join('');
  const fs=narrow?19:11.5,placed=[];
  const labels=top.map(m=>{const [cx,cy]=P(m);const r=rad(m);const t=m.label.split(',')[0].split('-')[0];const tw=t.length*fs*.64+6;
    const tries=[[cx+r+4,cy+fs*.35,'start'],[cx-r-4,cy+fs*.35,'end'],[cx-tw/2,cy-r-5,'start'],[cx-tw/2,cy+r+fs,'start'],[cx+r+4,cy-fs*.6,'start'],[cx+r+4,cy+fs*1.2,'start']];
    const box=([x,y,a])=>{const x0=a==='end'?x-tw:x;return [x0,y-fs*.85,x0+tw,y+fs*.2]};
    const dotsAround=top.filter(o=>o!==m).map(o=>{const [ox,oy]=P(o),rr=rad(o)+3;return [ox-rr,oy-rr,ox+rr,oy+rr]});
    const pad=fs*.5;const hit=b=>b[0]<L||b[2]>W-2||b[1]<T||[...placed,...dotsAround].some(q=>b[0]-pad<q[2]&&b[2]+pad>q[0]&&b[1]<q[3]&&b[3]>q[1]);
    const pick=tries.find(c=>!hit(box(c)))||tries[0];placed.push(box(pick));
    return `<text class="rc-lab" x="${pick[0].toFixed(1)}" y="${pick[1].toFixed(1)}" text-anchor="${pick[2]}">${esc(t)}</text>`}).join('');
  const qx=X(mx),qy=Y(my);
  const ticks=[10,20,50,100,200,500,1000,2000].filter(v=>Math.log10(v)>=y0&&Math.log10(v)<=y1).map(v=>`<text class="rc-tick" x="${L-6}" y="${(Y(Math.log10(v))+4).toFixed(1)}" text-anchor="end">${v>=1000?v/1000+'K':v}</text><line class="rc-grid" x1="${L}" x2="${L+iw}" y1="${Y(Math.log10(v)).toFixed(1)}" y2="${Y(Math.log10(v)).toFixed(1)}"/>`).join('');
  return `<section class="card" id="mk-room"><div class="card-head"><span class="ci green">${ico('target')}</span><div><h2>Food left on the table</h2><p>Each dot is a metro (biggest ${ms.length} by sales). Up = more listings a month that nobody grabbed in 2 weeks. Right = the eaters leave a bigger share. Bigger dot = more sales.</p></div></div>
  <div class="rc-wrap"><svg class="rc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter chart of metros: share of listings left over against listings left over each month">
    ${ticks}
    <rect class="rc-q" x="${qx.toFixed(1)}" y="${T}" width="${(L+iw-qx).toFixed(1)}" height="${(qy-T).toFixed(1)}"/>
    <text class="rc-qlab" x="${L+iw-8}" y="${T+16}" text-anchor="end">Lots of food left</text>
    <text class="rc-qlab dim" x="${L+8}" y="${T+16}">Big table, hungry eaters</text>
    <text class="rc-qlab dim" x="${L+iw-8}" y="${T+ih-8}" text-anchor="end">Small table, few eaters</text>
    <line class="rc-mid" x1="${qx.toFixed(1)}" x2="${qx.toFixed(1)}" y1="${T}" y2="${T+ih}"/><line class="rc-mid" x1="${L}" x2="${L+iw}" y1="${qy.toFixed(1)}" y2="${qy.toFixed(1)}"/>
    <line class="rc-axis" x1="${L}" x2="${L+iw}" y1="${T+ih}" y2="${T+ih}"/><line class="rc-axis" x1="${L}" x2="${L}" y1="${T}" y2="${T+ih}"/>
    <text class="rc-ax" x="${L+iw/2}" y="${H-12}" text-anchor="middle">${narrow?'Share left over after 2 weeks →':'Share of new listings still available after 2 weeks  →  more left over'}</text>
    <text class="rc-ax" transform="translate(14 ${T+ih/2}) rotate(-90)" text-anchor="middle">Listings left over a month</text>
    ${dots}${labels}</svg></div>
  <p class="xs muted">The 8 best for room at the table are labeled. Click a dot to open that metro. Lines mark the middle of the pack. Counts are for ZIPs that fit your box.</p></section>`;
}

/* ================= Bulk campaigns: many listings, one paced send queue ================= */
/* A campaign holds listings (from a Redfin CSV or pasted addresses). Each gets quick numbers from the ZIP's

   The queue sends at a human pace (daily cap, gap, local business hours), from a device or from Maya 24/7. */
const CP_STATUS={new:['New','slate'],skip:['Skipped','slate'],dup:['Already a deal','slate'],nocontact:['No email','amber'],ready:['Ready','blue'],queued:['Queued','purple'],sent:['Sent','green'],failed:['Failed','red'],needs:['Needs you','orange']};

const CP_TEMPLATE=`Subject: Cash offer on {street}

Hi {first},
