From what we can see it needs around {rehab} of work to sell near {arv}, which is how we got to our number.

Is the seller open to a cash offer? Happy to put it in writing.`;
const ST_TZ={AL:'America/Chicago',AK:'America/Anchorage',AZ:'America/Phoenix',AR:'America/Chicago',CA:'America/Los_Angeles',CO:'America/Denver',CT:'America/New_York',DE:'America/New_York',DC:'America/New_York',FL:'America/New_York',GA:'America/New_York',HI:'Pacific/Honolulu',ID:'America/Boise',IL:'America/Chicago',IN:'America/Indiana/Indianapolis',IA:'America/Chicago',KS:'America/Chicago',KY:'America/New_York',LA:'America/Chicago',ME:'America/New_York',MD:'America/New_York',MA:'America/New_York',MI:'America/Detroit',MN:'America/Chicago',MS:'America/Chicago',MO:'America/Chicago',MT:'America/Denver',NE:'America/Chicago',NV:'America/Los_Angeles',NH:'America/New_York',NJ:'America/New_York',NM:'America/Denver',NY:'America/New_York',NC:'America/New_York',ND:'America/Chicago',OH:'America/New_York',OK:'America/Chicago',OR:'America/Los_Angeles',PA:'America/New_York',RI:'America/New_York',SC:'America/New_York',SD:'America/Chicago',TN:'America/Chicago',TX:'America/Chicago',UT:'America/Denver',VT:'America/New_York',VA:'America/New_York',WA:'America/Los_Angeles',WV:'America/New_York',WI:'America/Chicago',WY:'America/Denver',PR:'America/Puerto_Rico'};
const ST_OFF={'America/New_York':-5,'America/Detroit':-5,'America/Indiana/Indianapolis':-5,'America/Chicago':-6,'America/Denver':-7,'America/Boise':-7,'America/Phoenix':-7,'America/Los_Angeles':-8,'America/Anchorage':-9,'Pacific/Honolulu':-10,'America/Puerto_Rico':-4};
function localClock(st,t){
  const tz=ST_TZ[String(st||'').toUpperCase()]||'America/Chicago';const at=new Date(t||Date.now());
  try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',hourCycle:'h23',weekday:'short'}).formatToParts(at).map(x=>[x.type,x.value]));return {hour:+p.hour%24,dow:p.weekday,tz}}
  catch(e){const d=new Date(at.getTime()+(ST_OFF[tz]||-6)*3600e3);return {hour:d.getUTCHours(),dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()],tz}}
}
const cpList=()=>Object.values(state.campaigns||{}).sort((a,b)=>String(b.created).localeCompare(String(a.created)));

/* ---- listings in ---- */
function cpItemsFromCSV(text){

function cpItemsFromLines(text){

  }).filter(x=>x.addr||x.url);

async function cpAddItems(c,items){
  const have=new Set(c.items.map(i=>normAddr(i.addr)+'|'+i.zip));let n=0;
  for(const it of items){const key=normAddr(it.addr)+'|'+it.zip;if(have.has(key))continue;have.add(key);c.items.push(it);n++}
  if(c.items.length>500)c.items=c.items.slice(0,500);

}
/* quick numbers: ARV from the ZIP's single-family $/sqft (Redfin) plus a renovation premium; rehab per sqft */
async function cpPrice(c){
  const states=[...new Set(c.items.map(i=>i.st).filter(s=>/^[A-Z]{2}$/.test(s)))];
  for(const st of states){try{await loadMarketState(st)}catch(e){}}
  const R=c.rules;const deals=Object.values(state.deals);const known=new Set(deals.map(d=>normAddr(streetOf(d.address))+'|'+(d.zip||'')));const dnc=dncSet();
  for(const it of c.items){
    if(['queued','sent','failed','needs'].includes(it.status))continue;
    const S=MKT.states[it.st];const Z=S&&S.zips&&S.zips.zips&&S.zips.zips[it.zip];const ppsf=Z&&Z.l&&Z.l.ppsf;
    it.ppsf=ppsf||null;it.arv=it.sqft&&ppsf?round500(it.sqft*ppsf*(1+(R.renoPct||0)/100)):null;it.arvRough=!it.arv;
    if(!it.arv&&it.price)it.arv=round500(it.price*1.25);
    it.rehab=it.sqft?round500(it.sqft*(R.rehabPsf||0)):null;
    const tmp={arv:it.arv,rehab:it.rehab||0,listPrice:it.price,priceHistory:[]};const k=calc(tmp);
    it.mao=k.ready?k.mao:null;it.offer=k.ready?k.opening:null;it.offerPct=it.offer&&it.price?it.offer/it.price:null;
    let why='';
    if(known.has(normAddr(it.addr)+'|'+(it.zip||'')))it.status='dup';
    else{
      if(it.listed&&it.listed!=='for_sale')why='not for sale ('+it.listed+')';
      else if(R.houseOnly&&it.type&&!/single|house|residential/i.test(it.type))why=it.type;
      else if(R.minDom&&(it.dom??0)<R.minDom)why=`${it.dom??0} days on market`;
      else if(R.maxList&&it.price>R.maxList)why='over your max price';
      else if(!it.offer)why='numbers don’t work';
      else if(R.minOfferPct&&it.offerPct!=null&&it.offerPct*100<R.minOfferPct)why=`offer would be ${Math.round(it.offerPct*100)}% of list`;
      else if(it.agent&&it.agent.email&&dnc.has(it.agent.email.toLowerCase()))why='agent asked not to be contacted';
      it.status=why?'skip':it.agent&&it.agent.email?'ready':it.look==='done'||it.look==='fail'?'nocontact':'new';
    }
    it.why=it.status==='skip'?why:it.status==='dup'?'already in your listings':'';
  }
}

/* ---- Maya finds the listing agent ---- */
function promptAgent(it){
  return `Find the listing agent for this home that is for sale now: ${[it.addr,it.city,it.st,it.zip].filter(Boolean).join(', ')}${it.mls?` (MLS# ${it.mls})`:''}.
${it.url?`Listing page: ${it.url}\n`:''}Use web search, and web fetch on listing pages (Redfin, Realtor.com, Homes.com, the brokerage site, the agent's own site). Many sites block bots; move on when one does.
Only report an email address or phone number you actually saw on a page for this agent. Never guess an email from a pattern.
Reply with only JSON: {"name":"agent name or null","brokerage":"or null","email":"or null","phone":"or null","source":"URL where you found the email or phone, or null","confidence":"high|medium|low"}`;
}
async function cpFindAgents(c){
  if(!aiOn()){toast(aiErr({code:'no_ai'}),5200);return}
  const todo=c.items.filter(i=>['new','nocontact'].includes(i.status)&&i.look!=='busy'&&!(i.agent&&i.agent.email)).slice(0,120);
  if(!todo.length){toast('Every listing that fits already has a contact or was looked up.');return}
  const key='cp-agents:'+c.id;const ctl=new AbortController();let done=0,found=0;
  state.busy[key]={label:`${negName()} is finding agents: 0 of ${todo.length}…`,ctl};render();
  const work=async it=>{
    if(ctl.signal.aborted)return;it.look='busy';
    try{const r=await apiTools(promptAgent(it),{signal:ctl.signal,maxTokens:1200,tools:WEB_TOOLS(4)});const j=parseLoose(r.text)||{};
      const email=/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(String(j.email||'').trim())?String(j.email).trim().toLowerCase():'';
      it.agent={name:String(j.name||'').trim(),brokerage:String(j.brokerage||'').trim(),email,phone:String(j.phone||'').trim(),src:String(j.source||''),conf:String(j.confidence||'')};
      it.look='done';if(email)found++}
    catch(e){it.look=e&&e.code==='cancelled'?null:'fail'}
    done++;if(state.busy[key])state.busy[key].label=`${negName()} is finding agents: ${done} of ${todo.length} (${found} emails)…`;render();
  };
  try{const q=todo.slice();await Promise.all([0,1,2].map(async()=>{while(q.length&&!ctl.signal.aborted)await work(q.shift())}))}
  finally{delete state.busy[key];todo.forEach(i=>{if(i.look==='busy')i.look=null});await cpPrice(c);saveCampaign(c);
    toast(`Found ${found} agent email${found===1?'':'s'} for ${done} listing${done===1?'':'s'}.`,4200)}
}
function cpCallList(c){
  const rows=c.items.filter(i=>i.agent&&i.agent.phone&&!i.agent.email&&i.status!=='skip');
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=['Address,City,State,ZIP,List price,Our offer,Agent,Brokerage,Phone,Listing'].concat(rows.map(i=>[i.addr,i.city,i.st,i.zip,i.price,i.offer,i.agent.name,i.agent.brokerage,i.agent.phone,i.url].map(q).join(','))).join('\n');

}

/* ---- launch: every ready listing becomes a deal waiting in the queue ---- */
function cpLaunch(c){
  const ready=c.items.filter(i=>i.status==='ready');if(!ready.length){toast('No listings are ready. Each needs an agent email and numbers that work.');return}
  const R=c.rules;let n=0;

      listingUrl:it.url||'',mlsId:it.mls||'',lat:it.lat,lng:it.lng,propertyType:'single_family',source:'mls',arv:it.arv,arvSource:'market',rehab:it.rehab,rehabSource:'estimate',
      agent:{name:it.agent.name||'',email:it.agent.email,phone:it.agent.phone||'',brokerage:it.agent.brokerage||''},autopilot:!!R.autopilot,campaign:{id:c.id,k:it.k}});
    state.deals[d.id]=d;it.dealId=d.id;it.status='queued';it.queuedAt=nowISO();n++;
  }
  c.status='running';c.launched=c.launched||nowISO();(c.log=c.log||[]).unshift({at:nowISO(),t:`Launched ${n} listings`});
  persist('deals');saveCampaign(c);toast(`${n} listings queued. ${negName()} sends up to ${R.maxPerDay} a day, ${R.start}:00–${R.end}:00 their time.`,5200);
  if(!state.settings.auto.enabled&&R.autopilot)logActivity(null,'info','Campaign replies need autopilot on (Connect → Maya) to be answered automatically.');
}
function cpFill(tpl,d,c){

}
const sentToday=c=>c.items.filter(i=>i.sentAt&&isoDay(i.sentAt)===isoDay()).length;
function cpNextSlot(c){
  const R=c.rules;const last=c.items.reduce((m,i)=>i.sentAt&&i.sentAt>m?i.sentAt:m,'');
  const gap=(R.gapMin??8)*60e3*(c.jitter||1);return last?new Date(last).getTime()+gap:0;
}
function cpCanSendNow(c,it){
  const R=c.rules;const lc=localClock(it.st);
  if(!R.weekends&&(lc.dow==='Sat'||lc.dow==='Sun'))return false;
  return lc.hour>=(R.start??8)&&lc.hour<(R.end??18);

/* one step of the queue: called every tick (device every 3 min, Maya 24/7 every 5) */
async function campaignTick(){
  if(!gmailOn()||!aiOn()||approveMode())return 0;let sent=0;
  const quota=state.conn.mailQuota;if(quota&&quota.left!=null&&quota.left<20&&quota.day===isoDay())return 0;
  const todayAgents=new Set(cpList().flatMap(c=>c.items.filter(i=>i.sentAt&&isoDay(i.sentAt)===isoDay()&&i.agent).map(i=>i.agent.email)));
  for(const c of cpList()){
    if(c.status!=='running'||timeUp())continue;
    if(sentToday(c)>=(c.rules.maxPerDay||40))continue;
    if(Date.now()<cpNextSlot(c))continue;
    const q=c.items.filter(i=>i.status==='queued');if(!q.length){if(!c.items.some(i=>i.status==='needs')){c.status='done';(c.log=c.log||[]).unshift({at:nowISO(),t:'Every listing was sent'});saveCampaign(c,true)}continue}
    const it=q.find(i=>cpCanSendNow(c,i)&&!todayAgents.has(i.agent&&i.agent.email));if(!it)continue;
    const d=state.deals[it.dealId];
    if(!d||d.optedOut||['dead','closed'].includes(d.stage)||ourCount(d)){it.status=d&&ourCount(d)?'sent':'skip';it.why=it.why||(d?'':'deal was deleted');saveCampaign(c,true);continue}
    if(!d.draft){
      if(c.rules.mode==='template'){const f=cpFill(c.rules.template,d,c);const k=calc(d);setDraft(d.id,{kind:'opening',action:'opening',price:k.opening,email:{subject:f.subject,body:f.body},sms:f.sms,why:'Campaign template'})}
      else await aiOpening(d.id,true);
    }
    const dd=state.deals[d.id];if(!dd||!dd.draft||!String(dd.draft.email&&dd.draft.email.body||'').trim()){if(dd&&dd.draft)dd.draft=null;it.tries=(it.tries||0)+1;if(it.tries>=3){it.status='failed';it.why=`${negName()} couldn’t write the opening`}saveCampaign(c,true);continue}
    const why=draftSafety(dd);
    if(why.length){it.status='needs';it.why=why.join(', ');dd.needsYou=it.why;saveDeal(dd,true);saveCampaign(c,true);continue}
    if(await sendEmailNow(dd.id,true)){
      const d2=state.deals[dd.id];if(d2&&d2.draft&&d2.draft.sent&&d2.draft.sent.email){d2.draft=null;saveDeal(d2,true)}
      it.status='sent';it.sentAt=nowISO();c.jitter=.7+Math.random()*.6;todayAgents.add(it.agent&&it.agent.email);sent++;
      logActivity(dd.id,'sent',`${negName()} sent the campaign opening on ${streetOf(dd.address)} at ${money(((dd.offers||[]).slice(-1)[0]||{}).price)}.`)}
    else{it.tries=(it.tries||0)+1;if(it.tries>=3){it.status='failed';it.why='email didn’t send 3 times'}}
    saveCampaign(c,true);
  }
  return sent;
}
function cpStats(c){
  const ds=c.items.map(i=>i.dealId&&state.deals[i.dealId]).filter(Boolean);
  const replied=ds.filter(d=>ins(d).length).length;const sent=c.items.filter(i=>i.status==='sent').length;
  return {total:c.items.length,ready:c.items.filter(i=>i.status==='ready').length,queued:c.items.filter(i=>i.status==='queued').length,sent,replied,
    neg:ds.filter(d=>d.stage==='negotiating').length,contract:ds.filter(d=>['contract','closed'].includes(d.stage)).length,needs:c.items.filter(i=>i.status==='needs').length,
    nocontact:c.items.filter(i=>i.status==='nocontact').length,lookup:c.items.filter(i=>i.status==='new').length,skip:c.items.filter(i=>['skip','dup'].includes(i.status)).length,
    rate:sent?replied/sent:null,today:sentToday(c)};
}

/* ================= Research pack: fills Ezra's own research workbook from public data ================= */
/* He stars metros on Markets. OfferDesk then fills the workbook's ZIPs, Metros (jobs, population), Listing Watch,
   Flip Candidates and Competition tabs. Cells it fills are light blue and tagged "Auto (OfferDesk)", so rows he edits
   himself are never overwritten. The workbook template lives next to the app (research-template.xlsx). */
const RS_TPL='research-template.xlsx';
const EXCELJS_URL='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
const RS_TAG='Auto (OfferDesk)';
const RS_CAP=40;/* listings watched per metro */
const RS_CAND_CAP=25;/* flip candidates kept per metro */
function rsSt(){const r=state.research=state.research||{};r.listings=r.listings||{};r.cands=r.cands||{};r.flipZ=r.flipZ||{};r.comp=r.comp||{};r.imports=r.imports||[];return r}
function saveResearch(quiet){persist('research');if(!quiet)render()}
const rsMetros=()=>mkTargets().filter(t=>t.type==='metro');
const rsZipsPer=()=>{const n=+(mkSet().rsZips||6);return Math.max(1,Math.min(15,n||6))};
function rsZipsFor(key,n){
  const R=DISC.data?mkCompute():null;const m=R&&R.byKey[key];
  const zs=m?m.zips.slice():Object.values(DISC.byZip).filter(o=>o.mk===key&&o.price).sort((a,b)=>(b.sold||0)-(a.sold||0));
  return zs.slice(0,n||rsZipsPer());
}
/* county jobs and population for the ZIPs he is researching (weighted by sales), not the whole metro:
   a metro's booming suburbs can hide a shrinking city where the cheap houses are */
function rsMetroFacts(key){
  let wj=0,sj=0,wp=0,sp=0;const zs=rsZipsFor(key);
  for(const o of (zs.length?zs:Object.values(DISC.byZip).filter(o=>o.mk===key))){const w=Math.max(1,o.sold||1);const j=jobOf(o);if(j!=null){sj+=j*w;wj+=w}if(o.cPopG!=null){sp+=o.cPopG*w;wp+=w}}
  return {job:wj?sj/wj:null,popG:wp?sp/wp:null};
}
const rsDay=d=>{const x=d?new Date(d):new Date();return isNaN(x)?null:x.toISOString().slice(0,10)};
const rsDaysAgo=n=>rsDay(Date.now()-n*864e5);
/* Redfin writes sold dates like "September-15-2026"; also accept 9/15/2026 and 2026-09-15. Returns YYYY-MM-DD without time-zone shifts. */
const RS_MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function rsParseDate(s){
  s=String(s||'').trim();if(!s)return null;const p2=n=>String(n).padStart(2,'0');let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  if((m=s.match(/^([A-Za-z]{3})[a-z]*[-\s.]+(\d{1,2}),?[-\s]+(\d{4})$/))&&RS_MON[m[1].toLowerCase()])return `${m[3]}-${p2(RS_MON[m[1].toLowerCase()])}-${p2(m[2])}`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)))return `${m[3].length===2?'20'+m[3]:m[3]}-${p2(m[1])}-${p2(m[2])}`;
  return rsDay(s);
}
const rsKey=(addr,zip)=>normAddr(addr)+'|'+zip;

/* ---- Redfin downloads: for sale (incl. pending) and sold ---- */
function rsImportText(text,name){
  const R=rsSt();const metros=new Set(rsMetros().map(t=>t.key));const today=rsDay();
  const recs=csvRecords(text);const M=mkSet();const maxP=+M.maxPrice||null;
  const rep={file:name,at:nowISO(),forSale:0,sold:0,added:0,updated:0,cands:0,skipped:0,outside:0};
  const seenZips=new Set(),seenKeys=new Set();const fresh=[];const fz={};/* per ZIP in this file: sales in the last year, and how many look like flips */
  const per={};for(const L of Object.values(R.listings))per[L.metro]=(per[L.metro]||0)+1;
  const chosen={};for(const k of metros)chosen[k]=new Set(rsZipsFor(k).map(o=>o.z));
  for(const o of recs){
    const addr=col(o,['address','street address','property address']);const zip=(col(o,['zip or postal code','zip','zip code','postal code']).match(/\d{5}/)||[''])[0];
    if(!addr||!zip){rep.skipped++;continue}
    const z=DISC.byZip[zip];const mk=z&&z.mk;
    if(!mk||!metros.has(mk)){rep.outside++;continue}
    const st=csvStatus(o);const price=parseNum(col(o,['price','sold price','list price']));const sqft=parseNum(col(o,['square feet','sqft','sq ft']));
    const url=col(o,['url']);const rec={metro:mk,zip,addr:addr.trim(),city:col(o,['city']),url:/^https?:\/\//.test(url)?url:'',beds:parseNum(col(o,['beds'])),baths:parseNum(col(o,['baths'])),
      sqft,year:parseNum(col(o,['year built'])),dom:parseNum(col(o,['days on market']))};
    const key=rsKey(addr,zip);
    if(st==='sold'){
      rep.sold++;const soldOn=rsParseDate(col(o,['sold date','sale date','close date']));
      const L=R.listings[key];if(L&&L.status!=='Sold'){L.status='Sold';L.soldOn=soldOn;L.soldPrice=price;L.lastSeen=today;rep.updated++}
      /* likely renovated resale: an older house that sold well above its ZIP's typical $/sqft in the last year */
      const zp=z.ppsf;const pp=price&&sqft?price/sqft:null;
      /* some MLSs (Columbia, SC) leave the sold date out of downloads; the Sold links only search the last year, so an undated sale counts as recent */
      const inYr=soldOn?soldOn>=rsDaysAgo(365):true;
      if(inYr&&price&&sqft>=600)(fz[zip]=fz[zip]||{s:0,c:0}).s++;
      if(zp&&pp&&sqft>=600&&(rec.year||0)<=1995&&pp>=zp*1.25&&inYr){fz[zip].c++;
        const had=R.cands[key];R.cands[key]=Object.assign(had||{at:today},{...rec,soldOn,soldPrice:price,zipPpsf:zp,prem:pp/zp-1});if(!had)rep.cands++;
      }

    }

    const status=st==='pending'?'Pending':'Active';
    const L=R.listings[key];

      if(L.status!=='Sold')L.status=status;L.lastSeen=today;rep.updated++;
    }else if(!maxP||!price||price<=maxP*1.15)fresh.push({key,rec,price,status,inChosen:chosen[mk]&&chosen[mk].has(zip)});
  }
  /* new listings: the ones in your chosen ZIPs and the newest first, up to the cap per metro */
  fresh.sort((a,b)=>(b.inChosen-a.inChosen)||((a.rec.dom??999)-(b.rec.dom??999)));
  for(const f of fresh){
    if((per[f.rec.metro]||0)>=RS_CAP)continue;per[f.rec.metro]=(per[f.rec.metro]||0)+1;
    R.listings[f.key]={...f.rec,list0:f.price,price:f.price,listedOn:f.rec.dom!=null?rsDaysAgo(f.rec.dom):today,status:f.status,pendingOn:f.status==='Pending'?today:null,firstSeen:today,lastSeen:today};

  for(const [zz,v] of Object.entries(fz)){const old=R.flipZ[zz];if(!old||v.s>=20||v.s>=old.s)R.flipZ[zz]={s:v.s,c:v.c,at:today}}

  const byM={};for(const [k,c] of Object.entries(R.cands))(byM[c.metro]=byM[c.metro]||[]).push([k,c]);
  for(const list of Object.values(byM)){list.sort((a,b)=>(b[1].prem||0)-(a[1].prem||0));for(const [k] of list.slice(RS_CAND_CAP))delete R.cands[k]}
  R.imports.unshift(rep);R.imports=R.imports.slice(0,30);
  return rep;
}

/* flips found in his sold downloads for a metro: total (not capped) and per 100 sales in the last year */
function rsFlips(key){
  const R=rsSt();let s=0,c=0,n=0;
  for(const [z,v] of Object.entries(R.flipZ)){const o=DISC.byZip[z];if(!o||o.mk!==key)continue;s+=v.s;c+=v.c;n++}

}
function rsSummary(key){
  const R=rsSt();const L=Object.values(R.listings).filter(x=>x.metro===key);const C=Object.values(R.cands).filter(x=>x.metro===key);
  const by=s=>L.filter(x=>x.status===s).length;

const RS_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFDDEBF7'}};
const xv=c=>{const v=c.value;if(v&&typeof v==='object'&&!(v instanceof Date)){if(v.richText)return v.richText.map(t=>t.text).join('');if('text' in v)return v.text;if('result' in v)return v.result;if('formula' in v)return null}return v};
const xs=c=>{const v=xv(c);return v==null?'':String(v).trim()};
const xDate=s=>{if(!s)return null;const d=new Date(s+'T00:00:00Z');return isNaN(d)?null:d};
function xSet(cell,v){cell.value=v==null||v===''?null:v;cell.style=Object.assign({},cell.style,{fill:RS_FILL})}
function xRows(ws,from,to){const out=[];for(let r=from;r<=to;r++)out.push(r);return out}
function xFirstEmpty(ws,from,to,cols){for(let r=from;r<=to;r++){if(cols.every(c=>!xs(ws.getCell(c+r))))return r}return null}
function rsClearExamples(wb){
  for(const ws of wb.worksheets){
    if(['Start Here','Deal Check'].includes(ws.name))continue;
    const row=ws.getRow(8);row.eachCell({includeEmpty:false},c=>{if(c.formula||(c.value&&typeof c.value==='object'&&'formula' in c.value))return;c.value=null});
  }
}
const RS_IN_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF2CC'}};
const xArgb=c=>{const f=c&&c.style&&c.style.fill;return f&&f.fgColor&&f.fgColor.argb?String(f.fgColor.argb).toUpperCase().slice(-6):''};
const xAuto=c=>xArgb(c)==='DDEBF7';
const xIsF=c=>{if(c.type===6)return true;const v=c.value;return !!(v&&typeof v==='object'&&('formula' in v||'sharedFormula' in v))};
const xEmpty=c=>{const v=c.value;return v==null||v===''};
/* last metro row in the Metros tab (the Ready check table starts 3 rows below it) */
function rsMetroEnd(ws){for(let r=8;r<=80;r++){if(xs(ws.getCell('A'+r)).startsWith('Ready check'))return r-3}return 13}
/* Rows OfferDesk filled for metros he un-starred: clear them, unless he typed something in the row himself. */
function rsPrune(wb,keep){
  const gone=new Set(),kept=new Set();
  for(const [name,to0] of [['Metros',0],['ZIPs',107],['Listing Watch',307],['Flip Candidates',307],['Competition',607]]){
    const ws=wb.getWorksheet(name);if(!ws)continue;
    const end=to0||rsMetroEnd(ws);
    for(let r=8;r<=end;r++){
      const label=xs(ws.getCell('A'+r));if(!label||keep.has(label.toLowerCase()))continue;
      const row=ws.getRow(r);let auto=0,mine=0;
      row.eachCell({includeEmpty:false},(c,col)=>{if(xEmpty(c)||xIsF(c))return;if(xAuto(c))auto++;else if(col!==1)mine++});
      const ready=name==='Metros'?['B','E','H'].map(k=>ws.getCell(k+(end+5+r-8))):[];
      if(ready.some(c=>!xEmpty(c)&&!xIsF(c)))mine++;
      if(!auto)continue;/* a metro he typed in himself: not ours to remove */
      if(mine){kept.add(label);continue}
      row.eachCell({includeEmpty:false},c=>{if(xIsF(c))return;const a=xAuto(c);c.value=null;if(a)c.style=Object.assign({},c.style,{fill:RS_IN_FILL})});
      gone.add(label);
    }
  }
  return {gone:[...gone],kept:[...kept]};
}
/* Older workbook (Metros fits fewer rows, or a tab is missing): move everything he has into the current template. */
async function rsTemplate(X){

function rsNeedsUpgrade(old,tpl){
  const a=old.getWorksheet('Metros'),b=tpl.getWorksheet('Metros');if(!a||!b)return false;
  const ver=w=>{const ws=w.getWorksheet('Start Here');return ws?xs(ws.getCell('Z1')):''};
  return ver(old)!==ver(tpl)||rsMetroEnd(a)!==rsMetroEnd(b)||tpl.worksheets.some(w=>!old.getWorksheet(w.name));
}
function rsUpgrade(old,tpl){
  for(const ws of old.worksheets){
    let t=tpl.getWorksheet(ws.name);const fresh=!t;
    if(fresh){t=tpl.addWorksheet(ws.name);for(let i=1;i<=ws.columnCount;i++){const w=ws.getColumn(i).width;if(w)t.getColumn(i).width=w}}
    const at=ws.name==='Metros'?rsMetroEnd(ws)+3:Infinity,by=ws.name==='Metros'?rsMetroEnd(t)-rsMetroEnd(ws):0;
    ws.eachRow({includeEmpty:false},(row,r)=>{
      const tr=r>=at?r+by:r;
      row.eachCell({includeEmpty:false},(c,col)=>{
        if(xEmpty(c))return;const d=t.getCell(tr,col);
        if(!fresh&&xIsF(d))return;/* the template's formula wins */
        if(!fresh&&!xEmpty(d)&&xArgb(d)!=='FFF2CC')return;/* headers and labels: keep the new ones */
        if(xIsF(c)){const fx=c.formula;if(!fx)return;d.value={formula:fx}}else d.value=c.value;
        if(fresh)d.style=c.style;else if(xAuto(c)||xArgb(c)==='FFF2CC')d.style=Object.assign({},d.style,{fill:c.style.fill});
      });
    });
  }
  return tpl;
}

function caseTimeline(k,d){

function scoreCall(k,g){

}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.hasAttribute('data-draft')){state.drafts[t.id]=t.value;return}
  if(t.dataset.mf&&state.modal){state.modal.form[t.dataset.mf]=t.value;return}
  if(t.id==='lf-q'){state.lf.q=t.value;state.page=1;clearTimeout(A._qt);A._qt=setTimeout(render,180);return}
  if(t.id==='leads-q'){state.leads.q=t.value;clearTimeout(A._qt);A._qt=setTimeout(render,180);return}
  if(t.dataset.sf){const d=cur();if(!d)return;const c=calc(d);d.sf=Object.assign(sfDefaults(d,c),d.sf||{});d.sf[t.dataset.sf]=parseFloat(t.value);clearTimeout(A._sf);A._sf=setTimeout(()=>saveDeal(d),60);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='deal-stage'){const d=cur();d.stage=t.value;if(['contract','closed','dead'].includes(t.value))d.autopilot=false;saveDeal(d);return}
  if(t.dataset.lf){state.lf[t.dataset.lf]=t.value;state.page=1;render();return}
  if(t.id==='leads-type'){state.leads.type=t.value;render();return}
  if(t.hasAttribute('data-draft')){state.drafts[t.id]=t.value;return}
  if(t.dataset.mfBool&&state.modal){state.modal.form[t.dataset.mfBool]=t.checked;return}
  if(t.dataset.qnote){const d=state.deals[t.dataset.qnote];if(d){d.quickNote=t.value.trim();saveDeal(d,true)}return}
  if(t.dataset.compsCsv&&t.files&&t.files[0]){const id=t.dataset.compsCsv;const fr=new FileReader();fr.onload=()=>importCompsCSV(id,String(fr.result||''));fr.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.photos){const files=[...t.files];t.value='';addPhotoBlobs(t.dataset.photos,files,'upload').then(n=>{if(n)toast(`Added ${n} photo${n>1?'s':''}. Run the inspection when you’re ready.`)});return}
  if(t.dataset.sec){const v=t.value.trim().replace(/\s+/g,'');setSecret(t.dataset.sec,t.dataset.sec==='apiKey'?v:t.value.trim());if(t.dataset.sec==='apiKey'){delete state.conn.aiCheck;saveConn();render();if(v)testKey()}else if(t.dataset.sec==='model'){delete state.conn.aiCheck;saveConn();render()}else render();return}
  if(t.id==='import-file'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||o.app!=='offerdesk')throw 0;state.settings=deepMerge(DEFAULTS,o.settings);state.deals=Object.assign({},state.deals,o.deals||{});state.practice=Object.assign({},state.practice,o.practice||{});['settings','deals','practice'].forEach(persist);render();toast(`Restored ${Object.keys(o.deals||{}).length} deals`)}catch(err){toast('That file isn’t an OfferDesk backup.')}};fr.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.cpCsv&&t.files&&t.files[0]){const c=state.campaigns[t.dataset.cpCsv];const fr=new FileReader();fr.onload=async()=>{const items=cpItemsFromCSV(String(fr.result||''));if(!items.length){toast('That file has no addresses. Use Redfin’s Download All.',5200);return}const n=await cpAddItems(c,items);toast(`Added ${n} listing${n===1?'':'s'}${n<items.length?` (${items.length-n} were already here)`:''}.`)};fr.readAsText(t.files[0]);t.value='';return}
  if(t.hasAttribute('data-rs-wb')&&t.files&&t.files[0]){const f=t.files[0];t.value='';rsWorkbook(f);return}
  if(t.hasAttribute('data-rs-csv')&&t.files&&t.files.length){const fs=[...t.files];t.value='';rsImportFiles(fs);return}
  if(t.dataset.cpAgent){const c=cpCur();const it=c&&c.items.find(i=>i.k===t.dataset.cpAgent);if(it){const v=t.value.trim().toLowerCase();if(v&&!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v)){toast('That doesn’t look like an email.');return}it.agent=Object.assign(it.agent||{},{email:v,src:it.agent&&it.agent.src||'you'});cpPrice(c).then(()=>saveCampaign(c))}return}
  if(t.id==='cp-sort'){state.cp.sort=t.value;render();return}
  if(t.id==='st-balance'){setBalance(t.value);render();toast(creditLeft()!=null?`Got it: ${usd(creditLeft())} left. OfferDesk counts down from here.`:'Balance cleared.');return}
  const typ=t.dataset.t||'text';
  const val=typ==='num'?parseNum(t.value):typ==='bool'?t.checked:typ==='nbool'?!t.checked:typ==='date'?(t.value?new Date(t.value).toISOString():null):typ==='list'?t.value.split(/[,\s]+/).map(Number).filter(n=>n>0).sort((a,b)=>a-b):t.value;
  if(t.dataset.cp){const c=cpCur();if(!c)return;setPath(c,t.dataset.cp,val);if(t.dataset.cp.startsWith('rules.')&&!['rules.template','rules.mode'].includes(t.dataset.cp))cpPrice(c).then(()=>saveCampaign(c));else saveCampaign(c);return}
  if(t.dataset.fd){
    const d=D();if(!d)return;const p=t.dataset.fd;
    if(p==='_list'){d.priceHistory=d.priceHistory||[];if(d.priceHistory.length)d.priceHistory[d.priceHistory.length-1].price=val;else if(val!=null)d.priceHistory.push({date:d.listedDate||d.created,price:val});d.listPrice=val}
    else if(p.startsWith('comps.')&&p.endsWith('.soldDate'))setPath(d,p,t.value);
    else setPath(d,p,val);
    if(p==='listedDate')d.domAtAdd=null;
    if(p==='arv')d.arvSource='you';if(p==='rehab')d.rehabSource='you';
    if(p==='address'&&hasStreet(d)){d.linkFill=Object.assign({},d.linkFill,{robot:[]});setTimeout(()=>maybeResearch(d.id),0)}
    saveDeal(d);return;
  }
  if(t.dataset.fs){setPath(state.settings,t.dataset.fs,val);saveSettings();if(/^(brief\.|notify\.email)/.test(t.dataset.fs))briefSync();return}
});

  if(z&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();z.classList.remove('over');addPhotoBlobs(z.dataset.drop,[...e.dataTransfer.files],'upload').then(n=>{if(n)toast(`Added ${n} photo${n>1?'s':''}`)});return}
  const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();col.classList.remove('over');
  const id=e.dataTransfer.getData('text/x-deal');const d=state.deals[id];if(d&&d.stage!==col.dataset.stage){d.stage=col.dataset.stage;if(['contract','closed','dead'].includes(d.stage))d.autopilot=false;saveDeal(d);toast('Moved to '+STAGE_LABEL[d.stage])}});
window.addEventListener('dragover',e=>{if(e.dataTransfer&&e.dataTransfer.types.includes('Files'))e.preventDefault()});
window.addEventListener('drop',e=>{if(!(e.target.closest&&e.target.closest('[data-drop]')))e.preventDefault()});

/* ================= boot ================= */
async function boot(){
  try{await IDB.open()}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const v={};for(const k of KEYS)v[k]=await readKey(k);
  if(!v.settings&&!v.deals){
    try{const o=JSON.parse(lsGet('od.local')||'null');if(o){v.settings=o.settings;v.deals=o.deals;v.practice=o.practice}}catch(e){}
    try{v.mail=v.mail||JSON.parse(lsGet('od.mail')||'null')}catch(e){}
    try{v.conn=v.conn||JSON.parse(lsGet('od.conn')||'null')}catch(e){}
  }
  state.settings=deepMerge(DEFAULTS,v.settings);
  {const mg=state.settings.migr=state.settings.migr||{};if(!mg.sig1023){state.settings.neg.optOutLine=false;mg.sig1023=new Date().toISOString();setTimeout(()=>saveSettings(),0)}
   if(!mg.full1023){mg.full1023=new Date().toISOString();if(state.settings.worker&&state.settings.worker.on)setTimeout(()=>{fullAuto(true);saveSettings()},0)}}
  state.practice=v.practice||{};state.campaigns=v.campaigns||{};state.spend=v.spend||{};state.research=v.research||{};state.mail=Object.assign(state.mail,v.mail||{});state.activity=v.activity||[];state.conn=v.conn||{};
  if(state.conn.email&&!state.conn.accounts){state.conn.accounts={g1:{email:state.conn.email,twilio:!!state.conn.twilio,twilioFrom:state.conn.twilioFrom||'',version:state.conn.version||1}};if(!state.settings.conn.sendAccount)state.settings.conn.sendAccount='g1'}
  state.deals=v.deals||null;
  if(!state.deals){state.deals=exampleDeals();if(!state.settings.profile.name)state.settings.profile.name='Ezra Rothschild';persist('deals');persist('settings')}
  for(const d of Object.values(state.deals)){d.mayaChat=d.mayaChat||[];if(d.arv&&!d.arvSource)d.arvSource='you'}
  const linked=cloudTakeLink();
  state.loaded=true;route();
  if(cloudOn()){if(linked)toast('Linked. Pulling your desk from the cloud…',4000);cloudSync().then(ok=>{if(linked)toast(ok?'Your desk is here. This device now stays in sync.':'Couldn’t reach the cloud yet. It will keep trying.',4600)})}
  setTimeout(()=>tick(false),2500);
  setTimeout(()=>{try{resumeLinks()}catch(e){}},6000);
  setTimeout(()=>{resumeAttachments().catch(()=>{})},9000);
  setInterval(()=>tick(false),3*60*1000);
  setInterval(()=>{if(document.visibilityState==='visible'&&cloudOn())cloudSync()},60*1000);
  checkUpdate();setInterval(checkUpdate,5*60*1000);
  {let lastW=innerWidth,rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-lastW)<80)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;lastW=innerWidth;if(document.getElementById('history'))render()},300)});addEventListener('resize',()=>{clearTimeout(window.__mkr);window.__mkr=setTimeout(()=>{if(document.getElementById('mk-canvas'))drawMarketMap()},150)})}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkUpdate();if(cloudOn())cloudSync()}});
}
/* ================= self-update (hosted version) ================= */
function checkUpdate(){
  if(location.protocol==='file:')return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.v&&j.v!==APP_V){state.updateReady=j.v;applyUpdate()}}).catch(()=>{});
}
function applyUpdate(){
  const v=state.updateReady;if(!v)return;
  const ae=document.activeElement;const typing=ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.value;
  if(Object.keys(state.busy).length||state.modal||state.syncing||state.autoRunning||typing){clearTimeout(A._upd);A._upd=setTimeout(applyUpdate,8000);return}
  let seen=null;try{seen=sessionStorage.getItem('od-upd-'+v)}catch(e){}if(seen)return;
  try{sessionStorage.setItem('od-upd-'+v,'1')}catch(e){}
  flushAll();toast('Updating OfferDesk\u2026');
  setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(v)+location.hash),700);
}
boot();
