name: Market data, other home types

# The same Redfin/Zillow/Census build for another Redfin property type, published to its own branch (data-<type>),
# never to the "data" branch. The app's Markets page reads data-townhouse when Home type is "Rowhouses & townhouses"
# (rowhouse cities like Philadelphia and Baltimore), so Townhouse also runs weekly, an hour after the main job.
on:
  schedule:
    - cron: '23 8 * * 3'
  workflow_dispatch:
    inputs:
      property_type:
        description: 'Redfin property type (Townhouse, All Residential, Condo/Co-op, Multi-Family (2-4 Unit))'
        required: true
        default: 'Townhouse'

permissions:
  contents: write

concurrency:
  group: market-extra
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet openpyxl
      - name: Build market data for ${{ inputs.property_type || 'Townhouse' }}
        env:
          MARKET_PROPERTY_TYPE: ${{ inputs.property_type || 'Townhouse' }}
        run: python src/market/build_market.py out/market
      - name: Publish to its own branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTYPE: ${{ inputs.property_type || 'Townhouse' }}
        run: |
          BR="data-$(echo "$PTYPE" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | sed 's/-*$//')"
          cd out
          git init -q
          git checkout -q -b "$BR"
          git add market
          git -c user.name="OfferDesk market job" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Market data ($PTYPE) $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
